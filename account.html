<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook - Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Firebase App (core) and Firebase Auth -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: { sans: ['Poppins', 'sans-serif'] }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') document.documentElement.classList.remove('dark');
    else document.documentElement.classList.add('dark');
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs">

<!-- APP LOCK SCREEN OVERLAY (BANK STYLE) -->
<div id="app-lock-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-6 hidden">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl text-center space-y-6">
        <div class="w-16 h-16 bg-emerald-600/20 border border-emerald-500/50 rounded-2xl mx-auto flex items-center justify-center text-emerald-400 text-2xl shadow-inner">
            <i class="fa-solid fa-lock"></i>
        </div>
        <div>
            <h2 class="text-base font-bold text-white" id="lock-title">Enter App MPIN</h2>
            <p class="text-[11px] text-slate-400 mt-1" id="lock-subtitle">Please enter your 4-digit MPIN to unlock</p>
        </div>
        <!-- PIN Dots Indicator -->
        <div class="flex justify-center gap-3 my-2">
            <div class="w-3.5 h-3.5 rounded-full bg-slate-800 border border-slate-700 pin-dot" id="dot-0"></div>
            <div class="w-3.5 h-3.5 rounded-full bg-slate-800 border border-slate-700 pin-dot" id="dot-1"></div>
            <div class="w-3.5 h-3.5 rounded-full bg-slate-800 border border-slate-700 pin-dot" id="dot-2"></div>
            <div class="w-3.5 h-3.5 rounded-full bg-slate-800 border border-slate-700 pin-dot" id="dot-3"></div>
        </div>
        <!-- Number Pad -->
        <div class="grid grid-cols-3 gap-3 pt-2">
            <button onclick="pressPin('1')" class="py-3.5 bg-slate-800/80 hover:bg-slate-700 rounded-2xl text-white font-bold text-base transition">1</button>
            <button onclick="pressPin('2')" class="py-3.5 bg-slate-800/80 hover:bg-slate-700 rounded-2xl text-white font-bold text-base transition">2</button>
            <button onclick="pressPin('3')" class="py-3.5 bg-slate-800/80 hover:bg-slate-700 rounded-2xl text-white font-bold text-base transition">3</button>
            <button onclick="pressPin('4')" class="py-3.5 bg-slate-800/80 hover:bg-slate-700 rounded-2xl text-white font-bold text-base transition">4</button>
            <button onclick="pressPin('5')" class="py-3.5 bg-slate-800/80 hover:bg-slate-700 rounded-2xl text-white font-bold text-base transition">5</button>
            <button onclick="pressPin('6')" class="py-3.5 bg-slate-800/80 hover:bg-slate-700 rounded-2xl text-white font-bold text-base transition">6</button>
            <button onclick="pressPin('7')" class="py-3.5 bg-slate-800/80 hover:bg-slate-700 rounded-2xl text-white font-bold text-base transition">7</button>
            <button onclick="pressPin('8')" class="py-3.5 bg-slate-800/80 hover:bg-slate-700 rounded-2xl text-white font-bold text-base transition">8</button>
            <button onclick="pressPin('9')" class="py-3.5 bg-slate-800/80 hover:bg-slate-700 rounded-2xl text-white font-bold text-base transition">9</button>
            <button onclick="useBiometric()" id="bio-btn" class="py-3.5 bg-slate-800/50 hover:bg-slate-700 rounded-2xl text-emerald-400 font-bold text-sm transition flex items-center justify-center"><i class="fa-solid fa-fingerprint text-lg"></i></button>
            <button onclick="pressPin('0')" class="py-3.5 bg-slate-800/80 hover:bg-slate-700 rounded-2xl text-white font-bold text-base transition">0</button>
            <button onclick="clearPin()" class="py-3.5 bg-slate-800/50 hover:bg-slate-700 rounded-2xl text-rose-400 font-bold text-xs transition"><i class="fa-solid fa-delete-left"></i></button>
        </div>
        <div class="pt-2">
            <button onclick="executeLogoutFromLock()" class="text-[11px] text-rose-500 hover:underline font-semibold">Sign Out / Switch Account</button>
        </div>
    </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

<div class="flex min-h-screen w-full">
    <!-- SIDEBAR -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full transition-transform duration-300 flex flex-col text-white">
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-md">
                    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <h1 class="text-sm font-extrabold tracking-wide text-white">Digital <span class="text-emerald-400">NoteBook</span></h1>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-lg">✕</button>
        </div>
        <div class="p-3 space-y-3 overflow-y-auto flex-1 text-xs">
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 flex items-center space-x-3">
                <div class="w-11 h-11 rounded-full bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden">
                    <img src="N1024.png" alt="Profile" class="w-full h-full object-cover">
                </div>
                <div>
                    <h3 id="sidebar-profile-name" class="text-white font-bold text-sm">User</h3>
                    <p class="text-[10px] text-slate-400" id="sidebar-user-email">Loading...</p>
                </div>
            </div>
            <nav class="space-y-1 font-medium">
                <a href="index.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl bg-emerald-600 text-white shadow-md shadow-emerald-600/20"><span>📊</span> <span>Overview</span></a>
                <a href="account.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><span>⚙️</span> <span>Account & Backup</span></a>
            </nav>
        </div>
    </div>

    <div class="flex-1 flex flex-col w-full">
        <!-- HEADER -->
        <header class="sticky top-0 z-30 flex items-center justify-between px-3 md:px-5 py-3.5 bg-slate-900/95 backdrop-blur border-b border-emerald-500/20 shadow-md">
            <div class="flex items-center space-x-2.5">
                <button onclick="toggleSidebar()" class="text-white text-xl hover:text-emerald-400 transition">☰</button>
                <div class="flex items-center space-x-2 cursor-pointer" onclick="toggleSidebar()">
                    <div class="w-7 h-7 rounded-lg bg-emerald-600 flex items-center justify-center overflow-hidden">
                        <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
                    </div>
                    <span class="text-xs md:text-sm font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">Digital NoteBook</span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="toggleTheme()" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-sm">🌛</button>
                <div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center overflow-hidden cursor-pointer" onclick="window.location.href='account.html'">
                    <img src="N1024.png" alt="Profile" class="w-full h-full object-cover">
                </div>
            </div>
        </header>

        <!-- DASHBOARD MAIN CONTENT -->
        <main class="p-4 space-y-4 flex-1 w-full max-w-xl mx-auto overflow-y-auto">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl shadow-sm text-center space-y-3">
                <h1 class="text-lg font-bold text-emerald-600 dark:text-emerald-400">Welcome to Dashboard</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Your secure digital notebook is active and synchronized.</p>
                <div class="pt-2">
                    <a href="account.html" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold shadow-md inline-block">Go to Account & Security Settings</a>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDDY_v7RHnkCTI6uyV4DNDjqoaIBGweg8c",
      authDomain: "digital-a2552.firebaseapp.com",
      projectId: "digital-a2552",
      databaseURL: "https://digital-a2552-default-rtdb.asia-southeast1.firebasedatabase.app",
      storageBucket: "digital-a2552.firebasestorage.app",
      messagingSenderId: "218135618179",
      appId: "1:218135618179:web:821b76920d3e5669ac31b6"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('-translate-x-full');
    }

    function toggleTheme() {
        const html = document.documentElement;
        if (html.classList.contains('dark')) {
            html.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        } else {
            html.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        }
    }

    function showToast(msg, type = 'success') {
        const c = document.getElementById('toast-container');
        if(!c) return;
        const t = document.createElement('div');
        t.className = `${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold`;
        t.innerText = msg;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // LOCK SCREEN LOGIC
    let enteredPin = "";
    function checkAppLockState() {
        const isLocked = localStorage.getItem('app_locked') === 'true';
        const savedPin = localStorage.getItem('app_pin_lock');
        const lockScreen = document.getElementById('app-lock-screen');
        
        if (isLocked && savedPin) {
            lockScreen.classList.remove('hidden');
            updatePinDots();
            if (localStorage.getItem('biometric_lock') === 'true') {
                useBiometric();
            }
        } else {
            lockScreen.classList.add('hidden');
        }
    }

    function pressPin(num) {
        if (enteredPin.length < 4) {
            enteredPin += num;
            updatePinDots();
            if (enteredPin.length === 4) {
                verifyPin();
            }
        }
    }

    function clearPin() {
        enteredPin = "";
        updatePinDots();
    }

    function updatePinDots() {
        for (let i = 0; i < 4; i++) {
            const dot = document.getElementById(`dot-${i}`);
            if (i < enteredPin.length) {
                dot.classList.remove('bg-slate-800', 'border-slate-700');
                dot.classList.add('bg-emerald-500', 'border-emerald-400');
            } else {
                dot.classList.remove('bg-emerald-500', 'border-emerald-400');
                dot.classList.add('bg-slate-800', 'border-slate-700');
            }
        }
    }

    function verifyPin() {
        const savedPin = localStorage.getItem('app_pin_lock') || '1234';
        if (enteredPin === savedPin) {
            localStorage.removeItem('app_locked');
            document.getElementById('app-lock-screen').classList.add('hidden');
            enteredPin = "";
            showToast("App Unlocked Successfully!");
        } else {
            showToast("Incorrect MPIN!", "error");
            setTimeout(clearPin, 500);
        }
    }

    function useBiometric() {
        if (window.PublicKeyCredential) {
            showToast("Biometric verification simulated successfully!");
            localStorage.removeItem('app_locked');
            document.getElementById('app-lock-screen').classList.add('hidden');
        } else {
            showToast("Biometric not supported on this browser.", "error");
        }
    }

    function executeLogoutFromLock() {
        auth.signOut().then(() => {
            localStorage.removeItem('app_locked');
            window.location.href = 'index.html';
        });
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('sidebar-user-email').innerText = user.email;
            document.getElementById('sidebar-profile-name').innerText = user.displayName || "User";
            checkAppLockState();
        } else {
            // यदि लगइन छैन भने लगइन वा स्वागत पेजमा पठाउन सकिन्छ
            document.getElementById('sidebar-user-email').innerText = "Not Logged In";
        }
    });
</script>
</body>
</html>
