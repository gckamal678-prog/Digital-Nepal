<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook - Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Poppins', 'sans-serif'],
            }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs flex flex-col h-screen overflow-hidden select-none">

<!-- SIDEBAR -->
<div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full transition-transform duration-300 flex flex-col text-white">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
        <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-lg bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-md">
                <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
            </div>
            <h1 class="text-sm font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">
                Digital NoteBook
            </h1>
        </div>
        <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-lg focus:outline-none">✕</button>
    </div>

    <div class="p-3 space-y-3 overflow-y-auto flex-1 text-xs">
        <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 flex items-center space-x-3">
            <div class="relative cursor-pointer group" onclick="document.getElementById('avatar-upload-input').click()">
                <div class="w-11 h-11 rounded-full bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-sm">
                    <img id="sidebar-avatar-img" src="N1024.png" alt="Profile" class="w-full h-full object-cover">
                </div>
            </div>
            <input type="file" id="avatar-upload-input" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
            <div>
                <h3 id="sidebar-profile-name" class="text-white font-bold text-sm"></h3>
                <p class="text-[10px] text-slate-400"><span class="lang-text" data-en="Click icon to set photo" data-np="फोटो राख्न क्लिक गर्नुहोस्">Click icon to set photo</span></p>
            </div>
        </div>

        <nav class="space-y-1 font-medium">
            <a href="index.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><span>📊</span> <span class="lang-text" data-en="Overview" data-np="अवलोकन">Overview</span></a>
            <a href="#" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl bg-emerald-600 text-white shadow-md transition"><span>🧮</span> <span class="lang-text" data-en="Digital Calculator" data-np="डिजिटल क्याल्कुलेटर">Digital Calculator</span></a>
        </nav>

        <div class="space-y-2.5 bg-slate-800/50 p-3 rounded-xl border border-slate-700/60">
            <h3 class="text-[11px] font-bold text-white flex items-center gap-1.5 mb-1">
                <i class="fa-solid fa-address-card text-emerald-400"></i> <span class="lang-text" data-en="Personal Info" data-np="व्यक्तिगत विवरण">Personal Info</span>
            </h3>
            <div>
                <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span class="lang-text" data-en="Full Name" data-np="पूरा नाम">Full Name</span></label>
                <input type="text" id="input-full-name" placeholder="Enter Full Name" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span class="lang-text" data-en="Address" data-np="ठेगाना">Address</span></label>
                <input type="text" id="input-address" placeholder="Enter Address" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span class="lang-text" data-en="Mobile Number" data-np="मोबाइल नम्बर">Mobile Number</span></label>
                <input type="tel" id="input-mobile" placeholder="Enter Mobile Number" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
            </div>
            <button onclick="saveProfileDetails()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition shadow-md">
                <span class="lang-text" data-en="Save Info" data-np="सेभ गर्नुहोस्">Save Info</span>
            </button>
        </div>
    </div>
</div>

<!-- MAIN LAYOUT -->
<div class="flex-1 flex flex-col h-full w-full">
    
    <!-- HEADER SECTION -->
    <header class="sticky top-0 z-40 flex items-center justify-between px-3 md:px-5 py-3.5 bg-slate-900/95 backdrop-blur border-b border-emerald-500/20 shadow-md">
        <div class="flex items-center space-x-2.5">
            <button onclick="toggleSidebar()" class="text-white text-xl focus:outline-none hover:text-emerald-400 transition">☰</button>
            <div class="flex items-center space-x-2 cursor-pointer" onclick="toggleSidebar()">
                <div class="w-7 h-7 rounded-lg bg-emerald-600 border border-emerald-500/50 flex items-center justify-center overflow-hidden shadow-sm">
                    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <span class="text-xs md:text-sm font-extrabold tracking-wider bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
                    Digital NoteBook
                </span>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Floating / Mini Mode Button -->
            <button onclick="toggleFloatMode()" id="float-mode-btn" title="Toggle Floating Mode" class="px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-200 hover:bg-slate-700 transition flex items-center gap-1">
                <i class="fa-solid fa-clone"></i> <span class="lang-text" data-en="Mini" data-np="सानो">Mini</span>
            </button>
            <button onclick="minimizeCalculator()" title="Dashboard" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:bg-slate-700"><i class="fa-solid fa-house text-[10px]"></i></button>
            <button onclick="toggleLanguage()" id="lang-toggle-btn" class="px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-200 hover:bg-slate-700 transition">ENG</button>
            <button onclick="toggleTheme()" id="theme-toggle-btn" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-sm hover:bg-slate-700 transition">🌛</button>
            <div class="relative cursor-pointer" onclick="toggleSidebar()">
                <div class="w-8 h-8 rounded-full bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-sm">
                    <img id="header-avatar-img" src="N1024.png" alt="Profile" class="w-full h-full object-cover">
                </div>
            </div>
        </div>
    </header>

    <!-- CALCULATOR CONTENT -->
    <main id="main-calculator-container" class="flex-1 flex flex-col items-center justify-center p-4 w-full h-full bg-slate-100 dark:bg-slate-950 overflow-hidden transition-all duration-300">
        <div id="calculator-card" class="w-full max-w-md h-full max-h-[620px] flex flex-col bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 p-5 space-y-4 transition-all">
            
            <div class="flex justify-between items-center px-1">
                <p id="dynamic-date" class="text-[10px] font-semibold tracking-wider text-slate-400 uppercase"></p>
                <span class="text-xs font-bold text-emerald-500 flex items-center gap-1"><i class="fa-solid fa-calculator"></i> Digital Calculator</span>
            </div>

            <!-- Screen Display -->
            <div class="bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-right flex flex-col justify-end h-28 overflow-hidden shadow-inner flex-shrink-0 relative group">
                <div id="calc-history" class="text-slate-400 text-xs tracking-wide h-5 overflow-x-auto whitespace-nowrap"></div>
                <div id="calc-display" class="text-slate-900 dark:text-white text-4xl font-bold tracking-wider overflow-x-auto whitespace-nowrap">0</div>
                <button onclick="copyResult()" title="Copy Result" class="absolute top-2 left-2 opacity-0 group-hover:opacity-100 transition bg-slate-800/60 text-white p-1 rounded text-[10px]"><i class="fa-solid fa-copy"></i></button>
            </div>

            <!-- Keypad Grid -->
            <div class="grid grid-cols-4 gap-2.5 flex-1">
                <button onclick="clearCalculator()" class="bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">C</button>
                <button onclick="appendValue('%')" class="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">%</button>
                <button onclick="deleteLast()" class="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center"><i class="fa-solid fa-delete-left"></i></button>
                <button onclick="appendValue('/')" class="bg-emerald-500/10 text-emerald-500 hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">÷</button>

                <button onclick="appendValue('7')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">7</button>
                <button onclick="appendValue('8')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">8</button>
                <button onclick="appendValue('9')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">9</button>
                <button onclick="appendValue('*')" class="bg-emerald-500/10 text-emerald-500 hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">×</button>

                <button onclick="appendValue('4')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">4</button>
                <button onclick="appendValue('5')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">5</button>
                <button onclick="appendValue('6')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">6</button>
                <button onclick="appendValue('-')" class="bg-emerald-500/10 text-emerald-500 hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">-</button>

                <button onclick="appendValue('1')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">1</button>
                <button onclick="appendValue('2')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">2</button>
                <button onclick="appendValue('3')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">3</button>
                <button onclick="appendValue('+')" class="bg-emerald-500/10 text-emerald-500 hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">+</button>

                <button onclick="appendValue('0')" class="col-span-2 bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">0</button>
                <button onclick="appendValue('.')" class="bg-slate-100 dark:bg-slate-800/60 text-slate-800 dark:text-white hover:bg-emerald-600 hover:text-white font-bold rounded-2xl transition text-base flex items-center justify-center">.</button>
                <button onclick="calculateResult()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl transition shadow-md text-base flex items-center justify-center">=</button>
            </div>
        </div>
    </main>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.toggle('-translate-x-full');
    }

    let currentLang = localStorage.getItem('lang') || 'EN';

    function updateLanguageUI() {
        const btn = document.getElementById('lang-toggle-btn');
        if(btn) btn.innerText = currentLang;

        document.querySelectorAll('.lang-text').forEach(el => {
            const text = currentLang === 'NEP' ? el.getAttribute('data-np') : el.getAttribute('data-en');
            if(text) el.innerText = text;
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'NEP' : 'EN';
        localStorage.setItem('lang', currentLang);
        updateLanguageUI();
        updateDynamicHeader();
    }

    function updateThemeUI() {
        const isDark = document.documentElement.classList.contains('dark');
        const themeBtn = document.getElementById('theme-toggle-btn');
        if(themeBtn) themeBtn.innerText = isDark ? '🌛' : '🌞';
    }

    function toggleTheme() {
        const htmlEl = document.documentElement;
        if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        } else {
            htmlEl.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeUI();
    }

    function updateDynamicHeader() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateString = now.toLocaleDateString(currentLang === 'NEP' ? 'ne-NP' : 'en-US', options).toUpperCase();
        const dateEl = document.getElementById('dynamic-date');
        if (dateEl) dateEl.innerText = dateString;
    }

    function minimizeCalculator() {
        window.location.href = 'index.html';
    }

    // Floating Mini Mode Toggle
    let isFloat = false;
    function toggleFloatMode() {
        isFloat = !isFloat;
        const card = document.getElementById('calculator-card');
        const container = document.getElementById('main-calculator-container');
        
        if (isFloat) {
            card.className = "fixed bottom-5 right-5 w-80 h-[450px] flex flex-col bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-emerald-500/40 p-4 space-y-3 z-50 transition-all";
            container.classList.remove('items-center', 'justify-center');
        } else {
            card.className = "w-full max-w-md h-full max-h-[620px] flex flex-col bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 p-5 space-y-4 transition-all";
            container.classList.add('items-center', 'justify-center');
        }
    }

    function copyResult() {
        navigator.clipboard.writeText(currentInput);
        alert(currentLang === 'NEP' ? 'नतिजा क्लिपबोर्डमा कपी भयो!' : 'Result copied to clipboard!');
    }

    // CALCULATOR LOGIC
    let currentInput = "0";
    let historyInput = "";

    function updateDisplay() {
        document.getElementById('calc-display').innerText = currentInput;
        document.getElementById('calc-history').innerText = historyInput;
    }

    function appendValue(val) {
        if (currentInput === "0" && val !== '.') {
            currentInput = val;
        } else {
            currentInput += val;
        }
        updateDisplay();
    }

    function clearCalculator() {
        currentInput = "0";
        historyInput = "";
        updateDisplay();
    }

    function deleteLast() {
        if (currentInput.length > 1) {
            currentInput = currentInput.slice(0, -1);
        } else {
            currentInput = "0";
        }
        updateDisplay();
    }

    function calculateResult() {
        try {
            historyInput = currentInput;
            let sanitized = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
            let result = eval(sanitized);
            currentInput = Number.isFinite(result) ? String(result) : "Error";
            updateDisplay();
        } catch (error) {
            currentInput = "Error";
            updateDisplay();
        }
    }

    function saveProfileDetails() {
        const name = document.getElementById('input-full-name').value;
        const address = document.getElementById('input-address').value;
        const mobile = document.getElementById('input-mobile').value;

        if(name) localStorage.setItem('profile_name', name);
        localStorage.setItem('profile_address', address);
        localStorage.setItem('profile_mobile', mobile);

        loadUserData();
        alert(currentLang === 'NEP' ? 'विवरण सफलतापूर्वक सेभ भयो!' : 'Details saved successfully!');
    }

    function loadUserData() {
        const savedName = localStorage.getItem('profile_name') || '';
        const savedAddress = localStorage.getItem('profile_address') || '';
        const savedMobile = localStorage.getItem('profile_mobile') || '';

        if(document.getElementById('input-full-name')) document.getElementById('input-full-name').value = savedName;
        if(document.getElementById('input-address')) document.getElementById('input-address').value = savedAddress;
        if(document.getElementById('input-mobile')) document.getElementById('input-mobile').value = savedMobile;

        const nameEl = document.getElementById('sidebar-profile-name');
        if(nameEl) nameEl.innerText = savedName;
    }

    function handleAvatarUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                localStorage.setItem('profile_avatar', base64Image);
                loadAvatar();
            };
            reader.readAsDataURL(file);
        }
    }

    function loadAvatar() {
        const savedImage = localStorage.getItem('profile_avatar') || 'N1024.png';
        ['sidebar-avatar-img', 'header-avatar-img'].forEach(id => {
            const img = document.getElementById(id);
            if(img) img.src = savedImage;
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateLanguageUI();
        updateThemeUI();
        updateDynamicHeader();
        loadUserData();
        loadAvatar();
    });
</script>
</body>
</html>
