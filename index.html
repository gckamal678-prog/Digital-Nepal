<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NoteBook">
<link rel="apple-touch-icon" href="N1024.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spinSlow 8s linear infinite; }
</style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs font-sans">

<!-- MANDATORY AUTHENTICATION & LOGIN/SIGNUP OVERLAY -->
<div id="login-overlay" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4 hidden">
    <div class="max-w-sm w-full bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl space-y-5 text-white">
        
        <!-- Logo Container with N1024.png -->
        <div class="relative w-20 h-20 mx-auto rounded-2xl p-[2px] bg-gradient-to-r from-emerald-500 via-blue-500 to-purple-500 animate-spin-slow">
            <div class="w-full h-full bg-slate-900 rounded-2xl flex items-center justify-center overflow-hidden">
                <img src="N1024.png" alt="Logo" class="w-full h-full object-cover rounded-2xl" onerror="this.src='https://via.placeholder.com/150'">
            </div>
        </div>

        <div class="text-center space-y-1">
            <h2 id="auth-form-title" class="text-base font-bold text-emerald-400">Digital NoteBook Login</h2>
            <p id="auth-form-subtitle" class="text-xs text-slate-400">Please sign in or register to continue</p>
        </div>

        <!-- Input Fields -->
        <div class="space-y-3">
            <input type="email" id="auth-email" placeholder="Enter email" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500">
            <div class="space-y-1">
                <input type="password" id="auth-password" placeholder="Enter password (e.g. Abc@12)" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500">
                <p id="password-hint" class="text-[10px] text-slate-400 hidden px-1">Must be 6+ chars: Uppercase, Lowercase, Number & @!</p>
            </div>
            
            <div class="flex justify-between items-center text-[11px]">
                <button onclick="toggleAuthMode()" id="toggle-mode-btn" class="text-emerald-400 hover:underline">New user? Sign Up</button>
                <button onclick="handleForgotPassword()" class="text-slate-400 hover:underline">Forgot Password?</button>
            </div>
        </div>

        <!-- Action Button -->
        <div>
            <button id="auth-submit-btn" onclick="handleEmailLogin()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold text-xs transition shadow-lg">Login</button>
        </div>
    </div>
</div>

<!-- WELCOME SPLASH SCREEN -->
<div id="splash-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center text-white transition-opacity duration-700 overflow-hidden select-none">
    <div class="relative z-10 text-center space-y-6 max-w-sm px-6">
        <div class="flex justify-center">
            <div class="relative">
                <div class="absolute -inset-1 rounded-full bg-gradient-to-r from-emerald-500 to-teal-400 opacity-75 blur-sm animate-spin-slow"></div>
                <!-- N1024.png Logo Here -->
                <div class="relative w-20 h-20 rounded-full bg-slate-900/90 border-2 border-emerald-500/60 p-2 shadow-2xl flex items-center justify-center backdrop-blur-md overflow-hidden">
                    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover rounded-full" onerror="this.src='https://via.placeholder.com/150'">
                </div>
            </div>
        </div>
        <div class="space-y-2">
            <p class="text-emerald-400 text-[11px] font-mono tracking-widest uppercase">System Initializing...</p>
            <h1 class="text-xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-emerald-300 via-teal-200 to-white font-mono">DIGITAL NOTEBOOK</h1>
        </div>
        <div id="enter-container" class="pt-2 opacity-0 transition-opacity duration-500 pointer-events-none">
            <button onclick="dismissSplash()" class="px-6 py-2.5 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-300 text-xs font-mono transition-all">
                ACCESS NOTEBOOK
            </button>
        </div>
    </div>
</div>

<!-- TOAST NOTIFICATION -->
<div id="toast-notification" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-xl shadow-xl text-xs font-medium z-50 transition-all duration-300 opacity-0 pointer-events-none border border-slate-700">
    <span id="toast-message">Message</span>
</div>

<div class="flex min-h-screen w-full">
    <div class="flex-1 flex flex-col w-full p-6">
        <h1 class="text-lg font-bold text-emerald-400">Welcome to Digital Notebook Dashboard</h1>
        <p class="text-slate-400">You are successfully logged in!</p>
        <button onclick="handleLogout()" class="mt-4 px-4 py-2 bg-rose-600 text-white rounded-xl w-32 font-bold">Logout</button>
    </div>
</div>

<!-- Firebase & Application Scripts -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDY_v7RHnkCTI6uyV4DNDjqoaIBGweg8c",
      authDomain: "digital-a2552.firebaseapp.com",
      projectId: "digital-a2552",
      storageBucket: "digital-a2552.firebasestorage.app",
      messagingSenderId: "218135618179",
      appId: "1:218135618179:web:821b76920d3e5669ac31b6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isSignUpMode = false;

    window.toggleAuthMode = function() {
        isSignUpMode = !isSignUpMode;
        const title = document.getElementById('auth-form-title');
        const subtitle = document.getElementById('auth-form-subtitle');
        const btn = document.getElementById('auth-submit-btn');
        const toggleBtn = document.getElementById('toggle-mode-btn');
        const hint = document.getElementById('password-hint');

        if (isSignUpMode) {
            title.innerText = "Create New Account";
            subtitle.innerText = "Sign up with secure password criteria";
            btn.innerText = "Sign Up";
            btn.className = "w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-xs transition shadow-lg";
            toggleBtn.innerText = "Already have an account? Login";
            hint.classList.remove('hidden');
        } else {
            title.innerText = "Digital NoteBook Login";
            subtitle.innerText = "Please sign in to continue";
            btn.innerText = "Login";
            btn.className = "w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold text-xs transition shadow-lg";
            toggleBtn.innerText = "New user? Sign Up";
            hint.classList.add('hidden');
        }
    }

    // Password Validation Function
    function validatePassword(password) {
        if (password.length < 6) return "Password must be at least 6 characters long.";
        if (!/[A-Z]/.test(password)) return "Password must contain at least one uppercase letter (A-Z).";
        if (!/[a-z]/.test(password)) return "Password must contain at least one lowercase letter (a-z).  ";
        if (!/[0-9]/.test(password)) return "Password must contain at least one number (0-9).";
        if (!/[@!]/.test(password)) return "Password must contain at least one special character like @ or !.";
        return null;
    }

    onAuthStateChanged(auth, (user) => {
        const loginOverlay = document.getElementById('login-overlay');
        if (user) {
            if (loginOverlay) loginOverlay.classList.add('hidden');
        } else {
            if (loginOverlay) loginOverlay.classList.remove('hidden');
        }
    });

    window.authAction = function() {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        
        if (!email || !password) {
            showToast("Please fill in all fields.");
            return;
        }

        if (isSignUpMode) {
            const passwordError = validatePassword(password);
            if (passwordError) {
                showToast(passwordError);
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    showToast("Account successfully created and logged in!");
                })
                .catch((error) => {
                    showToast("Error: " + error.message);
                });
        } else {
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    showToast("Login successful!");
                })
                .catch((error) => {
                    showToast("Login failed: Incorrect email or password.");
                });
        }
    }

    // Bind submit button click to authAction
    document.getElementById('auth-submit-btn').onclick = window.authAction;

    window.handleForgotPassword = function() {
        const email = document.getElementById('auth-email').value.trim();
        if (!email) {
            showToast("Please enter your email address first.");
            return;
        }
        sendPasswordResetEmail(auth, email)
            .then(() => {
                showToast("Password reset link sent to your email.");
            })
            .catch((error) => {
                showToast("Error: " + error.message);
            });
    }

    window.handleLogout = function() {
        signOut(auth).then(() => {
            showToast("Logged out successfully.");
        });
    }
</script>

<script>
    function showToast(message) {
        const toast = document.getElementById('toast-notification');
        document.getElementById('toast-message').innerText = message;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        setTimeout(() => {
            toast.classList.remove('opacity-100');
            toast.classList.add('opacity-0', 'pointer-events-none');
        }, 3000);
    }

    // Splash screen animation timer
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            document.getElementById('enter-container').classList.remove('opacity-0', 'pointer-events-none');
        }, 1500);
    });

    function dismissSplash() {
        const splash = document.getElementById('splash-screen');
        if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 700);
        }
    }
</script>
</body>
</html>
