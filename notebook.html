<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital NoteBook - NotePad Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Poppins', 'sans-serif'],
            }
        }
    }
}
</script>
<script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    } else {
        document.documentElement.classList.add('dark');
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    [contenteditable=true]:empty:before {
        content: attr(placeholder);
        color: #94a3b8;
        pointer-events: none;
        display: block;
    }
</style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-xs flex flex-col h-screen overflow-hidden select-none">

<div class="flex min-h-screen w-full">
    
    <!-- SIDEBAR SECTION -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full transition-transform duration-300 flex flex-col text-white">
        
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-md">
                    <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">
                        Digital NoteBook
                    </h1>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-lg focus:outline-none">
                ✕
            </button>
        </div>

        <div class="p-3 space-y-3 overflow-y-auto flex-1 text-xs">
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 flex items-center space-x-3">
                <div class="relative cursor-pointer group" onclick="document.getElementById('avatar-upload-input').click()">
                    <div class="w-11 h-11 rounded-full bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-sm">
                        <img id="sidebar-avatar-img" src="N1024.png" alt="Profile" class="w-full h-full object-cover">
                    </div>
                </div>
                <input type="file" id="avatar-upload-input" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                <div>
                    <h3 id="sidebar-profile-name" class="text-white font-bold text-sm"></h3>
                    <p class="text-[10px] text-slate-400"><span class="lang-text" data-en="Click icon to set photo" data-np="फोटो राख्न क्लिक गर्नुहोस्">Click icon to set photo</span></p>
                </div>
            </div>

            <!-- SIDEBAR NAVIGATION -->
            <nav class="space-y-1 font-medium">
                <a href="index.html" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl hover:bg-slate-800 text-slate-300 transition"><span>📊</span> <span class="lang-text" data-en="Overview" data-np="अवलोकन">Overview</span></a>
                <a href="#" class="flex items-center gap-2.5 py-2.5 px-3 rounded-xl bg-emerald-600 text-white shadow-md transition"><span>📝</span> <span class="lang-text" data-en="NotePad Studio" data-np="नोटप्याड स्टुडियो">NotePad Studio</span></a>
            </nav>

            <div class="space-y-2.5 bg-slate-800/50 p-3 rounded-xl border border-slate-700/60">
                <h3 class="text-[11px] font-bold text-white flex items-center gap-1.5 mb-1">
                    <i class="fa-solid fa-address-card text-emerald-400"></i> <span class="lang-text" data-en="Personal Info" data-np="व्यक्तिगत विवरण">Personal Info</span>
                </h3>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span class="lang-text" data-en="Full Name" data-np="पूरा नाम">Full Name</span></label>
                    <input type="text" id="input-full-name" placeholder="Enter Full Name" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span class="lang-text" data-en="Address" data-np="ठेगाना">Address</span></label>
                    <input type="text" id="input-address" placeholder="Enter Address" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-0.5"><span class="lang-text" data-en="Mobile Number" data-np="मोबाइल नम्बर">Mobile Number</span></label>
                    <input type="tel" id="input-mobile" placeholder="Enter Mobile Number" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="saveProfileDetails()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition shadow-md">
                    <span class="lang-text" data-en="Save Info" data-np="सेभ गर्नुहोस्">Save Info</span>
                </button>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col w-full h-screen overflow-hidden">
        
        <!-- HEADER SECTION (Navbar) -->
        <header class="sticky top-0 z-40 flex items-center justify-between px-3 md:px-5 py-3.5 bg-slate-900/95 backdrop-blur border-b border-emerald-500/20 shadow-md">
            <div class="flex items-center space-x-2.5">
                <button onclick="toggleSidebar()" class="text-white text-xl focus:outline-none hover:text-emerald-400 transition">☰</button>
                <div class="flex items-center space-x-2 cursor-pointer" onclick="toggleSidebar()">
                    <div class="w-7 h-7 rounded-lg bg-emerald-600 border border-emerald-500/50 flex items-center justify-center overflow-hidden shadow-sm">
                        <img src="N1024.png" alt="Logo" class="w-full h-full object-cover">
                    </div>
                    <span class="text-xs md:text-sm font-extrabold tracking-wider bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
                        Digital NoteBook
                    </span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="toggleLanguage()" id="lang-toggle-btn" class="px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-200 hover:bg-slate-700 transition">ENG</button>
                <button onclick="toggleTheme()" id="theme-toggle-btn" class="w-7 h-7 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-sm hover:bg-slate-700 transition">🌛</button>
                <div class="relative cursor-pointer" onclick="toggleSidebar()">
                    <div class="w-8 h-8 rounded-full bg-emerald-600 border border-emerald-500 flex items-center justify-center overflow-hidden shadow-sm">
                        <img id="header-avatar-img" src="N1024.png" alt="Profile" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </header>

        <!-- CONTENT -->
        <main class="p-4 md:p-6 space-y-4 flex-1 w-full overflow-y-auto">
            <div class="flex justify-between items-center px-1 py-1 text-white">
                <div>
                    <p id="dynamic-date" class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase mb-1"></p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
                <div class="relative flex-1 max-w-md">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-search"></i></span>
                    <input type="text" id="search-input" oninput="renderNotes()" placeholder="Search notes..." class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-white text-xs outline-none">
                </div>
                <button onclick="openNoteModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-md">
                    <i class="fa-solid fa-plus"></i> <span class="lang-text" data-en="New Note" data-np="नयाँ नोट">New Note</span>
                </button>
            </div>

            <!-- Notes Grid Container -->
            <div id="notes-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </main>
    </div>
</div>

<!-- Modal -->
<div id="note-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-2xl w-full max-w-lg space-y-4 border border-slate-200 dark:border-slate-800">
        <div class="flex justify-between items-center">
            <h3 id="modal-title" class="text-base font-bold text-slate-900 dark:text-slate-100">Create New Note</h3>
            <button onclick="closeNoteModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <input type="hidden" id="edit-note-id">
        <input type="text" id="note-title-input" placeholder="Note Title..." class="w-full border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-3 rounded-xl text-sm font-bold outline-none">
        
        <div id="note-content-input" contenteditable="true" placeholder="Write your note here..." class="w-full h-40 border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-3 rounded-xl text-xs outline-none overflow-y-auto"></div>

        <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeNoteModal()" class="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-white px-4 py-2 rounded-xl text-xs font-medium">Cancel</button>
            <button onclick="saveNote()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-xs font-medium shadow-md">Save Note</button>
        </div>
    </div>
</div>

<script>
    let notes = JSON.parse(localStorage.getItem('digital_notebook_notes')) || [];
    let currentLang = localStorage.getItem('lang') || 'EN';

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.toggle('-translate-x-full');
    }

    function updateLanguageUI() {
        const btn = document.getElementById('lang-toggle-btn');
        if(btn) btn.innerText = currentLang;

        document.querySelectorAll('.lang-text').forEach(el => {
            const text = currentLang === 'NEP' ? el.getAttribute('data-np') : el.getAttribute('data-en');
            if(text) el.innerText = text;
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'NEP' : 'EN';
        localStorage.setItem('lang', currentLang);
        updateLanguageUI();
        updateDynamicHeader();
    }

    function updateThemeUI() {
        const isDark = document.documentElement.classList.contains('dark');
        const themeBtn = document.getElementById('theme-toggle-btn');
        if(themeBtn) themeBtn.innerText = isDark ? '🌛' : '🌞';
    }

    function toggleTheme() {
        const htmlEl = document.documentElement;
        if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        } else {
            htmlEl.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeUI();
    }

    function updateDynamicHeader() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateString = now.toLocaleDateString(currentLang === 'NEP' ? 'ne-NP' : 'en-US', options).toUpperCase();
        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        const timeString = now.toLocaleTimeString('en-US', timeOptions);

        const dateEl = document.getElementById('dynamic-date');
        if (dateEl) dateEl.innerText = `${dateString} | ${timeString}`;
    }

    setInterval(updateDynamicHeader, 1000);

    function saveProfileDetails() {
        const name = document.getElementById('input-full-name').value;
        const address = document.getElementById('input-address').value;
        const mobile = document.getElementById('input-mobile').value;

        if(name) localStorage.setItem('profile_name', name);
        localStorage.setItem('profile_address', address);
        localStorage.setItem('profile_mobile', mobile);

        loadUserData();
        alert(currentLang === 'NEP' ? 'विवरण सफलतापूर्वक सेभ भयो!' : 'Details saved successfully!');
    }

    function loadUserData() {
        const savedName = localStorage.getItem('profile_name') || '';
        const savedAddress = localStorage.getItem('profile_address') || '';
        const savedMobile = localStorage.getItem('profile_mobile') || '';

        if(document.getElementById('input-full-name')) document.getElementById('input-full-name').value = savedName;
        if(document.getElementById('input-address')) document.getElementById('input-address').value = savedAddress;
        if(document.getElementById('input-mobile')) document.getElementById('input-mobile').value = savedMobile;

        const nameEl = document.getElementById('sidebar-profile-name');
        if(nameEl) nameEl.innerText = savedName;
    }

    function handleAvatarUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                localStorage.setItem('profile_avatar', base64Image);
                loadAvatar();
            };
            reader.readAsDataURL(file);
        }
    }

    function loadAvatar() {
        const savedImage = localStorage.getItem('profile_avatar') || 'N1024.png';
        ['sidebar-avatar-img', 'header-avatar-img'].forEach(id => {
            const img = document.getElementById(id);
            if(img) img.src = savedImage;
        });
    }

    function openNoteModal(id = null) {
        document.getElementById('note-modal').classList.remove('hidden');
        if(id) {
            const note = notes.find(n => n.id === id);
            if(note) {
                document.getElementById('edit-note-id').value = note.id;
                document.getElementById('note-title-input').value = note.title;
                document.getElementById('note-content-input').innerHTML = note.content;
            }
        } else {
            document.getElementById('edit-note-id').value = '';
            document.getElementById('note-title-input').value = '';
            document.getElementById('note-content-input').innerHTML = '';
        }
    }

    function closeNoteModal() {
        document.getElementById('note-modal').classList.add('hidden');
    }

    function saveNote() {
        const id = document.getElementById('edit-note-id').value;
        const title = document.getElementById('note-title-input').value.trim();
        const content = document.getElementById('note-content-input').innerHTML.trim();

        if(!title && !content) return;

        if(id) {
            notes = notes.map(n => n.id == id ? {...n, title, content} : n);
        } else {
            notes.unshift({id: Date.now(), title: title || 'Untitled', content, date: new Date().toLocaleDateString()});
        }

        localStorage.setItem('digital_notebook_notes', JSON.stringify(notes));
        closeNoteModal();
        renderNotes();
    }

    function deleteNote(id) {
        if(confirm('Delete this note?')) {
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('digital_notebook_notes', JSON.stringify(notes));
            renderNotes();
        }
    }

    function renderNotes() {
        const grid = document.getElementById('notes-grid');
        const query = document.getElementById('search-input').value.toLowerCase();
        const filtered = notes.filter(n => n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query));

        if(filtered.length === 0) {
            grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">No notes found.</div>`;
            return;
        }

        grid.innerHTML = filtered.map(n => `
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between space-y-3">
                <div>
                    <h4 class="font-bold text-slate-900 dark:text-white text-sm mb-1">${n.title}</h4>
                    <div class="text-slate-600 dark:text-slate-300 text-xs line-clamp-3">${n.content}</div>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 text-[10px] text-slate-400">
                    <span>${n.date}</span>
                    <div class="flex gap-2">
                        <button onclick="openNoteModal(${n.id})" class="text-emerald-500 hover:text-emerald-600"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteNote(${n.id})" class="text-rose-500 hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateLanguageUI();
        updateThemeUI();
        updateDynamicHeader();
        loadUserData();
        loadAvatar();
        renderNotes();
    });
</script>
</body>
</html>
