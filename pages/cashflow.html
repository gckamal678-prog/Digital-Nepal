<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Income, Cashflow & Party Ledger - Digital Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 4px; }
    </style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 p-2 md:p-6 pb-28 transition-colors duration-300 w-full m-0 min-h-screen flex flex-col justify-between">

<div class="space-y-4 w-full flex-1 max-w-5xl mx-auto">
    <!-- Header Section with Corrected Global PDF Filter (Styled as per image) -->
    <div class="flex justify-between items-center bg-white dark:bg-slate-900 p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
        <h1 class="text-base md:text-xl font-bold tracking-wider text-slate-900 dark:text-white flex items-center gap-2.5">
            <span class="p-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-emerald-500">📊</span> 
            <span id="profile-org-name">Cashflow & Ledger</span>
        </h1>
        <button type="button" id="generate-pdf-btn" class="bg-rose-500 hover:bg-rose-600 text-white border-none px-4 py-2 rounded-xl cursor-pointer text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-file-pdf"></i> PDF
        </button>
    </div>

    <!-- Filter Bar Container (Matched with image layout - Single Line) -->
    <div class="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center gap-2 shadow-sm overflow-x-auto">
        <div class="flex-1 min-w-[120px]">
            <select id="transaction-type-filter" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                <option value="all">🏢 (All)</option>
                <option value="Receivable">लिने (Receivable)</option>
                <option value="Expense">खर्च (Expense)</option>
                <option value="Payable">दिने (Payable)</option>
                <option value="Savings">बचत (Savings)</option>
                <option value="Income">आम्दानी</option>
            </select>
        </div>
        <div class="flex-1 min-w-[120px]">
            <input type="date" id="start-date" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none"> 
        </div>
        <div class="flex items-center gap-1.5 flex-1 min-w-[130px]">
            <span class="text-slate-400 text-xs shrink-0">To</span> 
            <input type="date" id="end-date" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
        </div>
    </div>

    <!-- Advanced Summary Cards -->
    <div class="space-y-3">
        <!-- First Line: Total Income, Total Saving, Expense -->
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-emerald-50 dark:bg-emerald-950/40 p-4 rounded-2xl border border-emerald-200 dark:border-emerald-900/50">
                <p class="text-[10px] md:text-[11px] text-emerald-700 dark:text-emerald-400 font-bold uppercase tracking-wider truncate">TOTAL INCOME</p>
                <h2 id="summary-income" class="text-sm md:text-xl font-extrabold text-emerald-800 dark:text-emerald-200 mt-1">Rs 0</h2>
            </div>
            <div class="bg-amber-50 dark:bg-amber-950/40 p-4 rounded-2xl border border-amber-200 dark:border-amber-900/50">
                <p class="text-[10px] md:text-[11px] text-amber-700 dark:text-amber-400 font-bold uppercase tracking-wider truncate">TOTAL SAVING</p>
                <h2 id="summary-cashflow" class="text-sm md:text-xl font-extrabold text-amber-800 dark:text-amber-200 mt-1">Rs 0</h2>
            </div>
            <div class="bg-blue-50 dark:bg-blue-950/40 p-4 rounded-2xl border border-blue-200 dark:border-blue-900/50">
                <p class="text-[10px] md:text-[11px] text-blue-700 dark:text-blue-400 font-bold uppercase tracking-wider truncate">EXPENSE</p>
                <h2 id="summary-expense" class="text-sm md:text-xl font-extrabold text-blue-800 dark:text-blue-200 mt-1">Rs 0</h2>
            </div>
        </div>

        <!-- Second Line: Receivable & Payable -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-rose-50 dark:bg-rose-950/40 p-4 rounded-2xl border border-rose-200 dark:border-rose-900/50">
                <p class="text-[10px] md:text-[11px] text-rose-700 dark:text-rose-400 font-bold uppercase tracking-wider truncate">RECEIVABLE</p>
                <h2 id="summary-receivable" class="text-sm md:text-xl font-extrabold text-rose-800 dark:text-rose-200 mt-1">Rs 0</h2>
            </div>
            <div class="bg-orange-50 dark:bg-orange-950/40 p-4 rounded-2xl border border-orange-200 dark:border-orange-900/50">
                <p class="text-[10px] md:text-[11px] text-orange-700 dark:text-orange-400 font-bold uppercase tracking-wider truncate">PAYABLE</p>
                <h2 id="summary-payable" class="text-sm md:text-xl font-extrabold text-orange-800 dark:text-orange-200 mt-1">Rs 0</h2>
            </div>
        </div>
    </div>

    <!-- ACCORDION CARD 1: ADD TRANSACTION -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden transition-colors">
        <button onclick="toggleAccordion('section-transaction')" class="w-full flex justify-between items-center p-4 md:p-5 text-left font-bold text-sm text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
            <span class="flex items-center gap-2"><i class="fa-solid fa-right-left text-blue-500"></i> Add New Transaction</span>
            <i id="icon-section-transaction" class="fa-solid fa-chevron-down transition-transform"></i>
        </button>
        <div id="content-section-transaction" class="hidden p-4 md:p-6 border-t border-slate-100 dark:border-slate-800 space-y-4">
            <form id="transaction-form" onsubmit="saveTransaction(event)" class="space-y-3">
                <input type="hidden" id="edit-txn-index" value="">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Date</label>
                        <input type="date" id="txn-date" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Name</label>
                        <input type="text" id="txn-party" placeholder="Enter name" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Type</label>
                        <select id="txn-type" onchange="handleTypeChange()" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Receivable">Receivable (लिनु)</option>
                            <option value="Payable">Payable (दिनु)</option>
                            <option value="Expense">Expense (खर्च)</option>
                        </select>
                    </div>
                    <div id="interest-fields-wrapper" class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Monthly Interest Rate (%)</label>
                            <input type="number" step="any" id="txn-interest-rate" value="0" oninput="calculateTotalAmount()" placeholder="Monthly Rate (%)" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Period (Months)</label>
                            <input type="number" step="any" id="txn-period" value="0" oninput="calculateTotalAmount()" placeholder="Time in months" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Principal Amount (NPR / INR)</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" step="any" id="txn-amount-npr" oninput="calculateTotalAmount()" placeholder="NPR (Rs)" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                            <input type="number" step="any" id="txn-amount-inr" oninput="calculateTotalAmount()" placeholder="INR (₹)" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Total Amount (Converted to NPR)</label>
                        <input type="text" id="txn-total-calc" readonly placeholder="Total calculation" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs outline-none font-bold">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Remarks / Note</label>
                    <input type="text" id="txn-note" placeholder="Optional details..." class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" id="txn-cancel-btn" onclick="resetTxnForm()" class="hidden w-1/3 bg-slate-500 text-white p-2.5 rounded-xl text-xs">Cancel</button>
                    <button type="submit" id="txn-submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2.5 rounded-xl text-xs transition">Save Transaction</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ACCORDION CARD 2: PARTY ACCOUNTS & LEDGER -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden transition-colors">
        <button onclick="toggleAccordion('section-party')" class="w-full flex justify-between items-center p-4 md:p-5 text-left font-bold text-sm text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
            <span class="flex items-center gap-2"><i class="fa-solid fa-users text-purple-500"></i> Party Accounts & Ledger</span>
            <i id="icon-section-party" class="fa-solid fa-chevron-down transition-transform"></i>
        </button>
        <div id="content-section-party" class="hidden p-4 md:p-6 border-t border-slate-100 dark:border-slate-800 space-y-4">
            <div class="flex justify-between items-center gap-2">
                <input type="text" id="search-party" placeholder="Search party name..." oninput="renderPartyAccounts()" class="w-full md:w-64 border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
            </div>
            <div id="party-list-container" class="space-y-3"></div>
        </div>
    </div>

    <!-- ACCORDION CARD 3: ADD INCOME -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden transition-colors">
        <button onclick="toggleAccordion('section-income')" class="w-full flex justify-between items-center p-4 md:p-5 text-left font-bold text-sm text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
            <span class="flex items-center gap-2"><i class="fa-solid fa-wallet text-emerald-500"></i> Add Income Source</span>
            <i id="icon-section-income" class="fa-solid fa-chevron-down transition-transform"></i>
        </button>
        <div id="content-section-income" class="hidden p-4 md:p-6 border-t border-slate-100 dark:border-slate-800 space-y-4">
            <form id="income-form" onsubmit="saveIncome(event)" class="space-y-3">
                <input type="hidden" id="edit-income-index" value="">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Income Source Name</label>
                        <input type="text" id="income-source-name" placeholder="Income Source Name" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Date</label>
                        <input type="date" id="income-date" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Amount (NPR / INR)</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" step="any" id="income-amount-npr" oninput="calculateIncomeTotal()" placeholder="NPR (Rs)" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                            <input type="number" step="any" id="income-amount-inr" oninput="calculateIncomeTotal()" placeholder="INR (₹)" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Total Amount (NPR)</label>
                        <input type="text" id="income-total-calc" readonly placeholder="Total in NPR" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs outline-none font-bold">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="button" id="income-cancel-btn" onclick="resetIncomeForm()" class="hidden w-1/3 bg-slate-500 text-white p-2.5 rounded-xl text-xs">Cancel</button>
                    <button type="submit" id="income-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium p-2.5 rounded-xl text-xs transition">Add Income</button>
                </div>
            </form>
            <div class="flex justify-end pt-2">
                <button onclick="printIncomePDF()" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5"><i class="fa-solid fa-print"></i> Print PDF</button>
            </div>
            <div id="income-list-container" class="space-y-2 pt-2"></div>
            <!-- Income Total Table -->
            <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700 flex justify-between items-center text-xs font-bold mt-2">
                <span>Total Income (Filtered):</span>
                <span id="income-table-total" class="text-emerald-500 text-sm">Rs 0</span>
            </div>
        </div>
    </div>

    <!-- ACCORDION CARD 4: ADD CASHFLOW / SAVINGS -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden transition-colors">
        <button onclick="toggleAccordion('section-savings')" class="w-full flex justify-between items-center p-4 md:p-5 text-left font-bold text-sm text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
            <span class="flex items-center gap-2"><i class="fa-solid fa-piggy-bank text-amber-500"></i> Add Cashflow / Savings</span>
            <i id="icon-section-savings" class="fa-solid fa-chevron-down transition-transform"></i>
        </button>
        <div id="content-section-savings" class="hidden p-4 md:p-6 border-t border-slate-100 dark:border-slate-800 space-y-4">
            <form id="savings-form" onsubmit="saveSavings(event)" class="space-y-3">
                <input type="hidden" id="edit-savings-index" value="">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div class="md:col-span-2">
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Cashflow Title</label>
                        <input type="text" id="savings-title" placeholder="Cashflow Title" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Category</label>
                        <select id="savings-category" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-2 rounded-xl text-xs outline-none">
                            <option value="Bank">🏦 Bank</option>
                            <option value="Cash">💵 Cash</option>
                            <option value="Investment">📈 Investment</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Amount (NPR / INR)</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" step="any" id="savings-amount-npr" oninput="calculateSavingsTotal()" placeholder="NPR (Rs)" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                            <input type="number" step="any" id="savings-amount-inr" oninput="calculateSavingsTotal()" placeholder="INR (₹)" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Total Amount (NPR)</label>
                        <input type="text" id="savings-total-calc" readonly placeholder="Total in NPR" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs outline-none font-bold">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Date</label>
                        <input type="date" id="savings-date" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="button" id="savings-cancel-btn" onclick="resetSavingsForm()" class="hidden w-1/3 bg-slate-500 text-white p-2.5 rounded-xl text-xs">Cancel</button>
                    <button type="submit" id="savings-submit-btn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium p-2.5 rounded-xl text-xs transition">Add Cashflow</button>
                </div>
            </form>
            <div class="flex justify-end pt-2">
                <button onclick="printSavingsPDF()" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5"><i class="fa-solid fa-print"></i> Print PDF</button>
            </div>
            <div id="savings-list-container" class="space-y-2 pt-2"></div>
            <!-- Savings Total Table -->
            <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700 flex justify-between items-center text-xs font-bold mt-2">
                <span>Total Cashflow / Savings (Filtered):</span>
                <span id="savings-table-total" class="text-amber-500 text-sm">Rs 0</span>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

<!-- Party Ledger Modal -->
<div id="ledger-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 p-3">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 w-full max-w-lg shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3">
            <h3 id="modal-party-title" class="text-sm font-bold text-slate-900 dark:text-white">Party Ledger</h3>
            <button onclick="closeLedgerModal()" class="text-slate-400 hover:text-rose-500 text-sm"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="modal-ledger-content" class="space-y-2 text-xs"></div>
        <div class="border-t border-slate-100 dark:border-slate-800 pt-3 space-y-3">
            <h4 class="font-bold text-xs text-slate-700 dark:text-slate-300">Settle / Payment</h4>
            <div class="grid grid-cols-2 gap-2">
                <input type="number" step="any" id="settle-amount" placeholder="Amount" class="border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                <select id="settle-type" class="border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-3 py-2 rounded-xl text-xs outline-none">
                    <option value="Paid">Payment Given (Paid)</option>
                    <option value="Received">Payment Received</option>
                </select>
            </div>
            <div class="flex gap-2">
                <button onclick="recordPartialSettle()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2.5 rounded-xl text-xs font-semibold">Save Payment</button>
                <button onclick="printPartyLedger()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-1.5"><i class="fa-solid fa-print"></i> Print PDF</button>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDY_v7RHnkCTI6uyV4DNDjqoaIBGweg8c",
      authDomain: "digital-a2552.firebaseapp.com",
      projectId: "digital-a2552",
      storageBucket: "digital-a2552.firebasestorage.app",
      messagingSenderId: "218135618179",
      appId: "1:218135618179:web:821b76920d3e5669ac31b6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbPush = push;

    window.dbOnValue = onValue;

    if(window.initFirebaseSync) {
        window.initFirebaseSync();

</script>

<script>
    let transactions = [];
    let incomes = [];
    let savings = [];
    let activePartyName = null;

    document.getElementById('txn-date').valueAsDate = new Date();
    document.getElementById('income-date').valueAsDate = new Date();
    document.getElementById('savings-date').valueAsDate = new Date();

    function initFirebaseSync() {
        window.dbOnValue(window.dbRef(window.db, 'my_transactions'), (snapshot) => {
            const data = snapshot.val();
            transactions = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
            refreshAll();
            if(activePartyName) renderModalLedgerContent();
        });

        window.dbOnValue(window.dbRef(window.db, 'my_incomes'), (snapshot) => {
            const data = snapshot.val();
            incomes = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
            refreshAll();
        });

        window.dbOnValue(window.dbRef(window.db, 'my_cashflow'), (snapshot) => {
            const data = snapshot.val();
            savings = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
            refreshAll();
        });
    }

    window.initFirebaseSync = initFirebaseSync;

    window.addEventListener('DOMContentLoaded', () => {
        const savedProfile = localStorage.getItem('userProfile');
        if (savedProfile) {
            const profile = JSON.parse(savedProfile);
            if(profile.name) {
                const orgNameEl = document.getElementById('profile-org-name');
                if(orgNameEl) orgNameEl.textContent = profile.name;
            }
        }
    });

    document.getElementById('generate-pdf-btn').addEventListener('click', () => {
        const selectedType = document.getElementById('transaction-type-filter').value;
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;

        const filteredData = transactions.filter(item => {
            const matchesType = (selectedType === 'all') || (item.type === selectedType);
            const matchesDate = (!startDate || item.date >= startDate) && (!endDate || item.date <= endDate);
            return matchesType && matchesDate;
        });

        generatePDFReport(filteredData, selectedType);
    });

    function generatePDFReport(data, type) {
        const printWindow = window.open('', '_blank');
        let orgName = document.getElementById('profile-org-name')?.textContent || 'Digital Notebook';

        let html = `<html><head><title>Financial Report</title><style>
            body { font-family: sans-serif; padding: 20px; color: #0f172a; }
            .pdf-header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 20px; }
            th, td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left; font-size: 11pt; }
            th { background: #f1f5f9; }
        </style></head><body>`;

        html += `<div class="pdf-header">`;
        html += `<h1 style="margin: 0; font-size: 20pt; color: #0f172a;">${orgName}</h1>`;
        html += `<p style="margin: 5px 0 0 0; font-size: 11pt; color: #64748b;">डिजिटल वित्तीय रिपोर्ट (${type})</p>`;
        html += `</div>`;

        html += `<table><tr><th>Date</th><th>Party / Name</th><th>Type</th><th>Note</th><th>Amount (Rs)</th></tr>`;
        let totalAmount = 0;
        data.forEach(item => {
            totalAmount += (item.amount || 0);
            html += `<tr><td>${item.date}</td><td>${item.party || '-'}</td><td>${item.type}</td><td>${item.note || '-'}</td><td>${item.amount}</td></tr>`;
        });
        html += `</table>`;
        html += `<p style="font-weight: bold; text-align: right;">Total: Rs ${totalAmount.toLocaleString()}</p>`;

        html += `</body></html>`;

        printWindow.document.write(html);
        printWindow.document.close();
        printWindow.print();
        showToast("PDF generated successfully!");
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `bg-slate-900 text-white border border-slate-800 px-4 py-2.5 rounded-xl text-xs shadow-xl flex items-center gap-2 transition-all duration-300 transform translate-y-[-10px] opacity-0 pointer-events-auto`;
        toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.remove('translate-y-[-10px]', 'opacity-0'), 10);
        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-[-10px]');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function toggleAccordion(sectionId) {
        const content = document.getElementById(`content-${sectionId}`);
        const icon = document.getElementById(`icon-${sectionId}`);
        content.classList.toggle('hidden');
        icon.classList.toggle('rotate-180');
    }

    function handleTypeChange() {
        const type = document.getElementById('txn-type').value;
        const interestWrapper = document.getElementById('interest-fields-wrapper');
        if (type === 'Expense') {
            interestWrapper.style.display = 'none';
        } else {
            interestWrapper.style.display = 'grid';
        }
        calculateTotalAmount();
    }

    function calculateTotalAmount() {
        const npr = parseFloat(document.getElementById('txn-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('txn-amount-inr').value) || 0;
        const principal = npr + (inr * 1.6); 
        const rate = parseFloat(document.getElementById('txn-interest-rate').value) || 0;
        const period = parseFloat(document.getElementById('txn-period').value) || 0;

        const type = document.getElementById('txn-type').value;
        let total = principal;
        if (type !== 'Expense' && rate > 0 && period > 0) {
            const interest = (principal * rate * period) / 100;
            total = principal + interest;
        }

        document.getElementById('txn-total-calc').value = total > 0 ? `Rs ${total.toFixed(2)}` : '';
    }

    function calculateIncomeTotal() {
        const npr = parseFloat(document.getElementById('income-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('income-amount-inr').value) || 0;
        const total = npr + (inr * 1.6);
        document.getElementById('income-total-calc').value = total > 0 ? `Rs ${total.toFixed(2)}` : '';
    }

    function calculateSavingsTotal() {
        const npr = parseFloat(document.getElementById('savings-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('savings-amount-inr').value) || 0;
        const total = npr + (inr * 1.6);
        document.getElementById('savings-total-calc').value = total > 0 ? `Rs ${total.toFixed(2)}` : '';
    }

    function formatPartyName(name) {
        if(!name) return '';
        return name.trim().replace(/\s+/g, ' ');
    }

    function saveTransaction(e) {
        e.preventDefault();
        const date = document.getElementById('txn-date').value;
        const party = formatPartyName(document.getElementById('txn-party').value);
        const type = document.getElementById('txn-type').value;
        const npr = parseFloat(document.getElementById('txn-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('txn-amount-inr').value) || 0;
        const principal = npr + (inr * 1.6);
        const rate = parseFloat(document.getElementById('txn-interest-rate').value) || 0;
        const period = parseFloat(document.getElementById('txn-period').value) || 0;
        
        let totalAmount = principal;
        if (type !== 'Expense' && rate > 0 && period > 0) {
            totalAmount = principal + (principal * rate * period) / 100;
        }

        const note = document.getElementById('txn-note').value;
        const index = document.getElementById('edit-txn-index').value;

        const txnData = { date, party, type, npr, inr, principal, rate, period, amount: totalAmount, note };

        if(index === "") {
            transactions.push(txnData);
            showToast("Transaction saved successfully!");
        } else {
            transactions[index] = txnData;
            showToast("Transaction updated successfully!");
        }

        saveData();
        resetTxnForm();
        if(activePartyName) renderModalLedgerContent();
    }

    function editTransaction(index) {
        const t = transactions[index];
        document.getElementById('edit-txn-index').value = index;
        document.getElementById('txn-date').value = t.date;
        document.getElementById('txn-party').value = t.party;
        document.getElementById('txn-type').value = t.type;
        document.getElementById('txn-amount-npr').value = t.npr || 0;
        document.getElementById('txn-amount-inr').value = t.inr || 0;
        document.getElementById('txn-interest-rate').value = t.rate || 0;
        document.getElementById('txn-period').value = t.period || 0;
        document.getElementById('txn-note').value = t.note || '';
        
        handleTypeChange();
        calculateTotalAmount();
        
        document.getElementById('txn-submit-btn').innerText = "Update Transaction";
        document.getElementById('txn-cancel-btn').classList.remove('hidden');
        
        const content = document.getElementById('content-section-transaction');
        if(content.classList.contains('hidden')) toggleAccordion('section-transaction');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteTransaction(index) {
        if(confirm("Are you sure you want to delete this transaction?")) {
            transactions.splice(index, 1);
            saveData();
            if(activePartyName) renderModalLedgerContent();
            showToast("Transaction deleted successfully!");
        }
    }

    function saveIncome(e) {
        e.preventDefault();
        const name = document.getElementById('income-source-name').value;
        const npr = parseFloat(document.getElementById('income-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('income-amount-inr').value) || 0;
        const amount = npr + (inr * 1.6);
        const date = document.getElementById('income-date').value;
        const index = document.getElementById('edit-income-index').value;

        if(index === "") {
            incomes.push({ name, npr, inr, amount, date });
            showToast("Income added successfully!");
        } else {
            incomes[index] = { name, npr, inr, amount, date };
            showToast("Income updated successfully!");
        }

        saveData();
        resetIncomeForm();
    }

    function editIncome(index) {
        const i = incomes[index];
        document.getElementById('edit-income-index').value = index;
        document.getElementById('income-source-name').value = i.name;
        document.getElementById('income-amount-npr').value = i.npr || i.amount;
        document.getElementById('income-amount-inr').value = i.inr || 0;
        document.getElementById('income-date').value = i.date;
        calculateIncomeTotal();
        document.getElementById('income-submit-btn').innerText = "Update Income";
        document.getElementById('income-cancel-btn').classList.remove('hidden');
    }

    function resetIncomeForm() {
        document.getElementById('income-form').reset();
        document.getElementById('edit-income-index').value = "";
        document.getElementById('income-date').valueAsDate = new Date();
        document.getElementById('income-total-calc').value = "";
        document.getElementById('income-submit-btn').innerText = "Add Income";
        document.getElementById('income-cancel-btn').classList.add('hidden');
    }

    function deleteIncome(index) {
        if(confirm("Are you sure you want to delete this income?")) {
            incomes.splice(index, 1);
            saveData();
            showToast("Income deleted successfully!");
        }
    }

    function saveSavings(e) {
        e.preventDefault();
        const title = document.getElementById('savings-title').value;
        const category = document.getElementById('savings-category').value;
        const npr = parseFloat(document.getElementById('savings-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('savings-amount-inr').value) || 0;
        const amount = npr + (inr * 1.6);
        const date = document.getElementById('savings-date').value;
        const index = document.getElementById('edit-savings-index').value;

        if(index === "") {
            savings.push({ title, category, npr, inr, amount, date });
            showToast("Cashflow added successfully!");
        } else {
            savings[index] = { title, category, npr, inr, amount, date };
            showToast("Cashflow updated successfully!");
        }

        saveData();
        resetSavingsForm();
    }

    function editSavings(index) {
        const s = savings[index];
        document.getElementById('edit-savings-index').value = index;
        document.getElementById('savings-title').value = s.title;
        document.getElementById('savings-category').value = s.category;
        document.getElementById('savings-amount-npr').value = s.npr || s.amount;
        document.getElementById('savings-amount-inr').value = s.inr || 0;
        document.getElementById('savings-date').value = s.date;
        calculateSavingsTotal();
        document.getElementById('savings-submit-btn').innerText = "Update Cashflow";
        document.getElementById('savings-cancel-btn').classList.remove('hidden');
    }

    function resetSavingsForm() {
        document.getElementById('savings-form').reset();
        document.getElementById('edit-savings-index').value = "";
        document.getElementById('savings-date').valueAsDate = new Date();
        document.getElementById('savings-total-calc').value = "";
        document.getElementById('savings-submit-btn').innerText = "Add Cashflow";
        document.getElementById('savings-cancel-btn').classList.add('hidden');
    }

    function deleteSavings(index) {
        if(confirm("Are you sure you want to delete this cashflow?")) {
            savings.splice(index, 1);
            saveData();
            showToast("Cashflow deleted successfully!");
        }
    }

    function saveData() {
        if (window.db && window.dbSet) {
            window.dbSet(window.dbRef(window.db, 'my_transactions'), transactions);
            window.dbSet(window.dbRef(window.db, 'my_incomes'), incomes);
            window.dbSet(window.dbRef(window.db, 'my_cashflow'), savings);
        }
        localStorage.setItem('my_transactions', JSON.stringify(transactions));
        localStorage.setItem('my_incomes', JSON.stringify(incomes));
        localStorage.setItem('my_cashflow', JSON.stringify(savings));
    }

    function resetTxnForm() {
        document.getElementById('transaction-form').reset();
        document.getElementById('edit-txn-index').value = "";
        document.getElementById('txn-date').valueAsDate = new Date();
        document.getElementById('txn-total-calc').value = "";
        document.getElementById('txn-submit-btn').innerText = "Save Transaction";
        document.getElementById('txn-cancel-btn').classList.add('hidden');
        handleTypeChange();
    }

    function getDateFilteredData(data) {
        const fromDate = document.getElementById('start-date').value;
        const toDate = document.getElementById('end-date').value;
        return data.filter(item => {
            if (fromDate && item.date < fromDate) return false;
            if (toDate && item.date > toDate) return false;
            return true;
        });
    }

    function refreshAll() {
        renderPartyAccounts();
        renderIncomeList();
        renderSavingsList();
        updateSummaryCards();
    }

    function updateSummaryCards() {
        const filteredTxns = getDateFilteredData(transactions);
        const filteredIncomes = getDateFilteredData(incomes);
        const filteredSavings = getDateFilteredData(savings);

        let receivable = 0;
        let payable = 0;
        let expense = 0;

        filteredTxns.forEach(t => {
            if(t.type === 'Receivable') receivable += t.amount;
            else if(t.type === 'Payable') payable += t.amount;
            else if(t.type === 'Expense') expense += t.amount;
        });

        let totalIncome = filteredIncomes.reduce((sum, i) => sum + i.amount, 0);
        let totalCashflow = filteredSavings.reduce((sum, s) => sum + s.amount, 0);

        document.getElementById('summary-income').innerText = 'Rs ' + totalIncome.toLocaleString();
        document.getElementById('summary-cashflow').innerText = 'Rs ' + totalCashflow.toLocaleString();
        document.getElementById('summary-expense').innerText = 'Rs ' + expense.toLocaleString();
        document.getElementById('summary-receivable').innerText = 'Rs ' + receivable.toLocaleString();
        document.getElementById('summary-payable').innerText = 'Rs ' + payable.toLocaleString();
    }

    function renderPartyAccounts() {
        const container = document.getElementById('party-list-container');
        const searchQuery = document.getElementById('search-party').value.toLowerCase();
        container.innerHTML = '';

        const partyMap = {};
        transactions.forEach((t) => {
            if(t.type === 'Expense') return;
            
            const cleanParty = t.party.trim();
            const lowerKey = cleanParty.toLowerCase();
            
            if(!partyMap[lowerKey]) {
                partyMap[lowerKey] = { displayName: cleanParty, receivable: 0, payable: 0 };
            }
            
            if(t.type === 'Receivable') partyMap[lowerKey].receivable += t.amount;
            else if(t.type === 'Payable') partyMap[lowerKey].payable += t.amount;
        });

        let partyKeys = Object.keys(partyMap).sort();
        if(searchQuery) {
            partyKeys = partyKeys.filter(k => partyMap[k].displayName.toLowerCase().includes(searchQuery));
        }

        if(partyKeys.length === 0) {
            container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">No party records found.</p>`;
            return;
        }

        partyKeys.forEach(key => {
            const data = partyMap[key];
            const net = data.receivable - data.payable;
            const netText = net >= 0 ? `To Take: Rs ${net.toLocaleString()}` : `To Give: Rs ${Math.abs(net).toLocaleString()}`;
            const badgeColor = net >= 0 ? 'text-emerald-500 bg-emerald-50 dark:bg-emerald-950/40' : 'text-rose-500 bg-rose-50 dark:bg-rose-950/40';

            container.innerHTML += `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center p-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 rounded-xl gap-2">
                    <div>
                        <h4 class="font-bold text-xs text-slate-900 dark:text-white">${data.displayName}</h4>
                        <p class="text-[11px] font-semibold mt-0.5 px-2 py-0.5 rounded inline-block ${badgeColor}">${netText}</p>
                    </div>
                    <button onclick="openLedgerModal('${data.displayName.replace(/'/g, "\\'")}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">View Ledger / Settle</button>
                </div>
            `;
        });
    }

    function openLedgerModal(party) {
        activePartyName = party;
        document.getElementById('modal-party-title').innerText = `Ledger: ${party}`;
        renderModalLedgerContent();
        const modal = document.getElementById('ledger-modal');
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeLedgerModal() {
        const modal = document.getElementById('ledger-modal');
        modal.classList.add('opacity-0');
        setTimeout(() => modal.classList.add('hidden'), 300);
        activePartyName = null;
    }

    function renderModalLedgerContent() {
        const content = document.getElementById('modal-ledger-content');
        content.innerHTML = '';
        
        const partyTxns = [];
        transactions.forEach((t, idx) => {
            if(t.party && t.party.toLowerCase() === activePartyName.toLowerCase() && t.type !== 'Expense') {
                partyTxns.push({ ...t, originalIndex: idx });
            }
        });

        if(partyTxns.length === 0) {
            content.innerHTML = `<p class="text-slate-400">No transactions recorded.</p>`;
            return;
        }

        partyTxns.forEach((t) => {
            const isRec = t.type === 'Receivable';
            content.innerHTML += `
                <div class="flex justify-between items-center bg-slate-100 dark:bg-slate-800 p-2.5 rounded-xl">
                    <div>
                        <p class="font-semibold text-slate-900 dark:text-white">${t.date} - ${t.note || t.type}</p>
                        <p class="text-[10px] text-slate-400">${t.type} ${t.rate ? `(Rate: ${t.rate}%, Period: ${t.period}m)` : ''}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold ${isRec ? 'text-emerald-500' : 'text-rose-500'}">Rs ${t.amount.toLocaleString()}</span>
                        <button onclick="editTransaction(${t.originalIndex}); closeLedgerModal();" class="text-blue-500 hover:text-blue-700 p-1"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button onclick="deleteTransaction(${t.originalIndex})" class="text-rose-500 hover:text-rose-700 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                </div>
            `;
        });
    }

    function recordPartialSettle() {
        const amount = parseFloat(document.getElementById('settle-amount').value);
        const type = document.getElementById('settle-type').value;
        if(!amount || amount <= 0) {
            showToast("Please enter a valid amount", "error");
            return;
        }

        const txnType = type === 'Paid' ? 'Payable' : 'Receivable';
        const noteText = type === 'Paid' ? 'Payment Given (Paid)' : 'Payment Received';
        
        transactions.push({
            party: activePartyName,
            type: txnType,
            amount: amount,
            date: new Date().toISOString().slice(0, 10),
            note: noteText,
            npr: amount, inr: 0, rate: 0, period: 0
        });

        saveData();
        document.getElementById('settle-amount').value = '';
        renderModalLedgerContent();
        showToast("Payment recorded successfully!");
    }

    function printPartyLedger() {
        const printWindow = window.open('', '_blank');
        const partyTxns = transactions.filter(t => t.party && t.party.toLowerCase() === activePartyName.toLowerCase() && t.type !== 'Expense');
        let html = `<html><head><title>Ledger - ${activePartyName}</title><style>body{font-family:sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;margin-top:20px;}th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f4f4f4;}</style></head><body>`;
        html += `<h2>Party Statement: ${activePartyName}</h2><p>Generated on: ${new Date().toLocaleDateString()}</p>`;
        html += `<table><tr><th>Date</th><th>Type</th><th>Note</th><th>Amount (Rs)</th></tr>`;
        partyTxns.forEach(t => {
            html += `<tr><td>${t.date}</td><td>${t.type}</td><td>${t.note || '-'}</td><td>${t.amount}</td></tr>`;
        });
        html += `</table></body></html>`;
        printWindow.document.write(html);
        printWindow.document.close();
        printWindow.print();
    }

    function printIncomePDF() {
        const printWindow = window.open('', '_blank');
        const filtered = getDateFilteredData(incomes);
        let html = `<html><head><title>Income Sources</title><style>body{font-family:sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;margin-top:20px;}th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f4f4f4;}</style></head><body>`;

    function renderIncomeList() {
        const container = document.getElementById('income-list-container');
        container.innerHTML = '';
        const filtered = incomes.map((item, idx) => ({ ...item, originalIndex: idx }));

        dateFiltered.forEach(i => {

            container.innerHTML += `
