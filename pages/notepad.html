<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NotePad - Digital Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script>
        // Apply saved theme immediately
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        // Apply saved font size immediately
        const savedFontSize = localStorage.getItem('font_size') || 'normal';
        if (savedFontSize === 'small') {
            document.documentElement.style.fontSize = '14px';
        } else if (savedFontSize === 'large' || savedFontSize === 'extra') {
            document.documentElement.style.fontSize = '18px';
        } else {
            document.documentElement.style.fontSize = '16px';
        }

        const savedFontFamily = localStorage.getItem('font_family') || 'Poppins';
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: var(--app-font, 'Poppins'), sans-serif; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 4px; }
        [contenteditable]:empty:before {
            content: attr(placeholder);
            color: #94a3b8;
            pointer-events: none;
            display: block;
        }
    </style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 p-2 md:p-6 pb-6 transition-colors duration-300 w-full m-0 min-h-screen relative">

<!-- Full Width Container matching Index Layout -->
<div class="space-y-3 w-full flex-1 mt-1 pb-6">
    <!-- Header Section -->
    <div class="flex flex-col md:flex-row justify-between items-center bg-white dark:bg-slate-900 p-3 md:p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 gap-4 transition-colors duration-300">
        <h1 class="text-base md:text-xl font-bold tracking-wider text-slate-900 dark:text-white flex items-center gap-2.5">
            <span class="p-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-indigo-500">📝</span> <span data-i18n="notepad_title">NotePad Studio</span>
        </h1>
        
        <!-- Search, Firebase & Actions -->
        <div class="flex items-center gap-2.5 w-full md:w-auto flex-wrap md:flex-nowrap">
            <div class="relative flex-1 md:w-64">
                <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                <input type="text" id="search-notes" placeholder="Search notes..." data-i18n-placeholder="search_placeholder" oninput="filterNotes()" class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
            </div>
            <!-- Firebase Backup/Sync Buttons -->
            <button onclick="syncFirebase()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold px-3 py-2.5 rounded-xl transition flex items-center gap-1.5 whitespace-nowrap shadow-sm" title="Firebase Sync">
                <i class="fa-solid fa-fire"></i> <span>Firebase Sync</span>
            </button>
            <button onclick="openNoteModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2 whitespace-nowrap shadow-sm">
                <i class="fa-solid fa-plus"></i> <span data-i18n="btn_new_note">New Note</span>
            </button>
        </div>
    </div>

    <!-- Category Filter Tabs -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs font-medium">
        <button onclick="setCategory('All')" id="cat-All" class="px-4 py-2 rounded-xl bg-indigo-600 text-white whitespace-nowrap transition shadow-sm" data-i18n="cat_all">All Notes</button>
        <button onclick="setCategory('Personal')" id="cat-Personal" class="px-4 py-2 rounded-xl bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 whitespace-nowrap transition" data-i18n="cat_personal">👤 Personal</button>
        <button onclick="setCategory('Work')" id="cat-Work" class="px-4 py-2 rounded-xl bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 whitespace-nowrap transition" data-i18n="cat_work">💼 Work</button>
        <button onclick="setCategory('Study')" id="cat-Study" class="px-4 py-2 rounded-xl bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 whitespace-nowrap transition" data-i18n="cat_study">📚 Study</button>
    </div>

    <!-- Notes Grid Container -->
    <div id="notes-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Dynamic Cards will load here -->
    </div>
</div>

<!-- Add/Edit Note Modal -->
<div id="note-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-lg space-y-4 border border-slate-200 dark:border-slate-800 relative">
        <div class="flex justify-between items-center">
            <h3 id="modal-title" class="text-base font-bold text-slate-900 dark:text-slate-100">Create New Note</h3>
            <button onclick="closeNoteModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>

        <input type="hidden" id="edit-note-id">

        <!-- Title -->
        <input type="text" id="note-title-input" placeholder="Note Title..." data-i18n-placeholder="title_placeholder" class="w-full border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-3 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500">

        <!-- Rich Text Formatting Toolbar -->
        <div class="flex flex-wrap items-center gap-1.5 bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-xs">
            <button type="button" onmousedown="event.preventDefault(); document.execCommand('bold', false, null)" class="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-300" title="Bold"><i class="fa-solid fa-bold"></i></button>
            <button type="button" onmousedown="event.preventDefault(); document.execCommand('italic', false, null)" class="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-300" title="Italic"><i class="fa-solid fa-italic"></i></button>
            <button type="button" onmousedown="event.preventDefault(); document.execCommand('underline', false, null)" class="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-300" title="Underline"><i class="fa-solid fa-underline"></i></button>
            <button type="button" onmousedown="event.preventDefault(); document.execCommand('insertUnorderedList', false, null)" class="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-300" title="Bullet List"><i class="fa-solid fa-list-ul"></i></button>
            <div class="h-4 w-px bg-slate-300 dark:bg-slate-700 mx-1"></div>
            <!-- Category Selector -->
            <select id="note-category" class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 px-2.5 py-1 rounded-lg text-xs outline-none">
                <option value="Personal" data-i18n="cat_personal_opt">Personal</option>
                <option value="Work" data-i18n="cat_work_opt">Work</option>
                <option value="Study" data-i18n="cat_study_opt">Study</option>
            </select>
            <!-- Note Color Selector -->
            <div class="flex items-center gap-1.5 ml-auto">
                <button type="button" onclick="setNoteColor('bg-white dark:bg-slate-900')" class="w-5 h-5 rounded-full bg-slate-200 border-2 border-slate-400 transition-transform hover:scale-110" title="Default"></button>
                <button type="button" onclick="setNoteColor('bg-amber-50 dark:bg-amber-950/30 border-amber-300 dark:border-amber-800/50')" class="w-5 h-5 rounded-full bg-amber-400 border-2 border-amber-600 transition-transform hover:scale-110" title="Yellow"></button>
                <button type="button" onclick="setNoteColor('bg-emerald-50 dark:bg-emerald-950/30 border-emerald-300 dark:border-emerald-800/50')" class="w-5 h-5 rounded-full bg-emerald-400 border-2 border-emerald-600 transition-transform hover:scale-110" title="Green"></button>
                <button type="button" onclick="setNoteColor('bg-sky-50 dark:bg-sky-950/30 border-sky-300 dark:border-sky-800/50')" class="w-5 h-5 rounded-full bg-sky-400 border-2 border-sky-600 transition-transform hover:scale-110" title="Blue"></button>
            </div>
        </div>

        <input type="hidden" id="note-bg-color" value="bg-white dark:bg-slate-900">

        <!-- Rich Text Content Editor -->
        <div id="note-content-input" contenteditable="true" placeholder="Write your note here..." data-i18n-placeholder="content_placeholder" oninput="updateCounters()" class="w-full h-40 border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-3 rounded-2xl text-xs outline-none focus:ring-2 focus:ring-indigo-500 overflow-y-auto"></div>

        <!-- Live Word & Character Counter -->
        <div class="flex justify-between items-center text-[11px] text-slate-500 dark:text-slate-400 px-1">
            <span id="counter-display">Words: 0 | Characters: 0</span>
            <span id="save-indicator" class="text-emerald-600 dark:text-emerald-500 font-medium" data-i18n="saved_text">Auto-saved</span>
        </div>

        <!-- Action Buttons with Firebase Cloud Backup -->
        <div class="flex justify-between items-center pt-2">
            <button onclick="backupToFirebase()" type="button" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2.5 rounded-xl text-xs font-medium transition flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-cloud-arrow-up"></i> <span>Firebase Save</span>
            </button>
            <div class="flex gap-2">
                <button onclick="closeNoteModal()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-white px-5 py-2.5 rounded-xl text-xs font-medium transition" data-i18n="btn_cancel">Cancel</button>
                <button onclick="saveNote()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl text-xs font-medium shadow-md transition" data-i18n="btn_save_note">Save Note</button>
            </div>
        </div>
    </div>
</div>

<!-- Custom Confirmation Modal -->
<div id="confirm-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[60] flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-2xl w-full max-w-sm space-y-4 border border-slate-200 dark:border-slate-800 text-center">
        <div class="text-rose-500 text-3xl mb-2"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <p id="confirm-modal-text" class="text-xs font-medium text-slate-800 dark:text-slate-200">Are you sure you want to delete this note?</p>
        <div class="flex justify-center gap-3 pt-2">
            <button id="confirm-cancel-btn" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-white px-4 py-2 rounded-xl text-xs font-medium transition">Cancel</button>
            <button id="confirm-ok-btn" class="bg-rose-600 hover:bg-rose-700 text-white px-5 py-2 rounded-xl text-xs font-medium transition shadow-md">Delete</button>
        </div>
    </div>
</div>

<!-- Custom Clean Toast Notification -->
<div id="toast-notification" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-5 py-2.5 rounded-2xl shadow-2xl text-xs font-semibold z-[90] transition-all duration-300 opacity-0 pointer-events-none border border-slate-700 dark:border-slate-200">
    <span id="toast-message">Notification message</span>
</div>

<script>
const translations = {
    en: {
        notepad_title: "NotePad Studio",
        search_placeholder: "Search notes...",
        btn_new_note: "New Note",
        cat_all: "All Notes",
        cat_personal: "👤 Personal",
        cat_work: "💼 Work",
        cat_study: "📚 Study",
        cat_personal_opt: "Personal",
        cat_work_opt: "Work",
        cat_study_opt: "Study",
        modal_create: "Create New Note",
        modal_edit: "Edit Note",
        title_placeholder: "Note Title...",
        content_placeholder: "Write your note here...",
        saved_text: "Auto-saved",
        btn_cancel: "Cancel",
        btn_save_note: "Save Note",
        no_notes: "No notes found. Click 'New Note' to create one!",
        delete_confirm: "Are you sure you want to delete this note?",
        empty_alert: "Note cannot be empty!",
        share_copied: "Note copied to clipboard for sharing!",
        share_btn: "Share"
    },
    np: {
        notepad_title: "नोटप्याड स्टुडियो",
        search_placeholder: "नोटहरू खोज्नुहोस्...",
        btn_new_note: "नयाँ नोट",
        cat_all: "सबै नोटहरू",
        cat_personal: "👤 व्यक्तिगत",
        cat_work: "💼 काम (Work)",
        cat_study: "📚 अध्ययन",
        cat_personal_opt: "व्यक्तिगत",
        cat_work_opt: "काम",
        cat_study_opt: "अध्ययन",
        modal_create: "नयाँ नोट सिर्जना गर्नुहोस्",
        modal_edit: "नोट सम्पादन गर्नुहोस्",
        title_placeholder: "नोटको शिर्षक...",
        content_placeholder: "यहाँ आफ्नो नोट लेख्नुहोस्...",
        saved_text: "स्वचालित सेभ भयो",
        btn_cancel: "रद्द गर्नुहोस्",
        btn_save_note: "नोट सेभ गर्नुहोस्",
        no_notes: "कुनै नोट फेला परेन। नयाँ बनाउन 'नयाँ नोट' मा क्लिक गर्नुहोस्!",
        delete_confirm: "के तपाईं यो नोट मेटाउन चाहनुहुन्छ?",
        empty_alert: "नोट खाली हुन सक्दैन!",
        share_copied: "शेयर गर्नको लागि नोट क्लिपबोर्डमा कपी भयो!",
        share_btn: "शेयर"
    }
};

function t(key) {
    const lang = localStorage.getItem('language') || 'en';
    return translations[lang] ? (translations[lang][key] || translations['en'][key] || key) : key;
}

function showToast(message) {
    const toast = document.getElementById('toast-notification');
    document.getElementById('toast-message').innerText = message;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    toast.classList.add('opacity-100');
    setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
    }, 2000);
}

function showConfirm(message, onConfirm) {
    const modal = document.getElementById('confirm-modal');
    document.getElementById('confirm-modal-text').innerText = message;
    modal.classList.remove('hidden');

    const cancelBtn = document.getElementById('confirm-cancel-btn');
    const okBtn = document.getElementById('confirm-ok-btn');

    const closeHandler = () => {
        modal.classList.add('hidden');
        cancelBtn.removeEventListener('click', closeHandler);
        okBtn.removeEventListener('click', okHandler);
    };

    const okHandler = () => {
        closeHandler();
        if (onConfirm) onConfirm();
    };

    cancelBtn.addEventListener('click', closeHandler);
    okBtn.addEventListener('click', okHandler);
}

let notes = [];
let currentCategory = 'All';

document.addEventListener("DOMContentLoaded", () => {
    applySettings();
    loadNotes();
    renderNotes();

    document.addEventListener('keydown', (e) => {
        const modal = document.getElementById('note-modal');
        if (!modal.classList.contains('hidden')) {
            if (e.key === 'Escape') {
                closeNoteModal();
            } else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveNote();
            }
        }
    });
});

function applySettings() {
    const isDark = (localStorage.getItem('theme') || 'dark') === 'dark';
    if (isDark) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }

    const size = localStorage.getItem('font_size') || 'normal';
    if (size === 'small') document.documentElement.style.fontSize = '14px';
    else if (size === 'large' || size === 'extra') document.documentElement.style.fontSize = '18px';
    else document.documentElement.style.fontSize = '16px';

    const fontFamily = localStorage.getItem('font_family') || 'Poppins';
    document.documentElement.style.setProperty('--app-font', fontFamily);

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.innerText = t(key);
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        el.placeholder = t(key);
    });
}

function loadNotes() {
    const saved = localStorage.getItem('advanced_notebook_notes');
    if (saved) {
        try { notes = JSON.parse(saved); } catch (e) { notes = []; }
    }
}

function saveToStorage() {
    localStorage.setItem('advanced_notebook_notes', JSON.stringify(notes));
}

function setCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('[id^="cat-"]').forEach(btn => {
        btn.className = "px-4 py-2 rounded-xl bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 whitespace-nowrap transition";
    });
    const activeBtn = document.getElementById('cat-' + cat);
    if (activeBtn) {
        activeBtn.className = "px-4 py-2 rounded-xl bg-indigo-600 text-white whitespace-nowrap transition shadow-sm";
    }
    renderNotes();
}

function renderNotes() {
    const grid = document.getElementById('notes-grid');
    const searchQuery = document.getElementById('search-notes').value.toLowerCase();
    grid.innerHTML = '';

    let filtered = notes.filter(n => {
        const matchesCat = currentCategory === 'All' || n.category === currentCategory;
        const plainContent = n.content.replace(/<[^>]*>?/gm, '').toLowerCase();
        const matchesSearch = n.title.toLowerCase().includes(searchQuery) || plainContent.includes(searchQuery);
        return matchesCat && matchesSearch;
    });

    filtered.sort((a, b) => (b.pinned === true) - (a.pinned === true) || b.id - a.id);

    if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-xs">${t('no_notes')}</div>`;
        return;
    }

    filtered.forEach(note => {
        const cardBg = note.bgColor || 'bg-white dark:bg-slate-900';
        grid.innerHTML += `
            <div class="${cardBg} rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between space-y-3 relative group transition hover:shadow-md">
                <div class="space-y-1.5">
                    <div class="flex justify-between items-start gap-2">
                        <h4 class="font-bold text-sm text-slate-900 dark:text-white truncate">${note.title || 'Untitled'}</h4>
                        <div class="flex items-center gap-1">
                            <button onclick="togglePin(${note.id})" class="text-slate-400 hover:text-indigo-500 text-xs p-1" title="Pin Note"><i class="fa-solid fa-thumbtack ${note.pinned ? 'text-indigo-500 rotate-45' : ''}"></i></button>
                            <button onclick="editNote(${note.id})" class="text-slate-400 hover:text-blue-500 text-xs p-1" title="Edit Note"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteNote(${note.id})" class="text-slate-400 hover:text-rose-500 text-xs p-1" title="Delete Note"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <span class="inline-block px-2.5 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-[10px] font-semibold text-slate-600 dark:text-slate-300">${note.category}</span>
                    <div class="text-xs text-slate-700 dark:text-slate-300 line-clamp-4 mt-2 overflow-hidden">${note.content}</div>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 text-[10px] text-slate-500 dark:text-slate-400">
                    <span>${note.date}</span>
                    <button onclick="shareNote(${note.id})" class="hover:text-indigo-500 flex items-center gap-1"><i class="fa-solid fa-share-nodes"></i> ${t('share_btn')}</button>
                </div>
            </div>
        `;
    });
}

function openNoteModal(id = null) {
    const modal = document.getElementById('note-modal');
    modal.classList.remove('hidden');
    
    if (id) {
        const note = notes.find(n => n.id === id);
        if (note) {
            document.getElementById('modal-title').textContent = t('modal_edit');
            document.getElementById('edit-note-id').value = note.id;
            document.getElementById('note-title-input').value = note.title;
            document.getElementById('note-content-input').innerHTML = note.content;
            document.getElementById('note-category').value = note.category;
            document.getElementById('note-bg-color').value = note.bgColor || 'bg-white dark:bg-slate-900';
        }
    } else {
        document.getElementById('modal-title').textContent = t('modal_create');
        document.getElementById('edit-note-id').value = '';
        document.getElementById('note-title-input').value = '';
        document.getElementById('note-content-input').innerHTML = '';
        document.getElementById('note-category').value = 'Personal';
        document.getElementById('note-bg-color').value = 'bg-white dark:bg-slate-900';
    }
    updateCounters();
}

function editNote(id) {
    openNoteModal(id);
}

function closeNoteModal() {
    document.getElementById('note-modal').classList.add('hidden');
}

function setNoteColor(colorClass) {
    document.getElementById('note-bg-color').value = colorClass;
    showToast("Color selected");
}

function saveNote() {
    const id = document.getElementById('edit-note-id').value;
    const title = document.getElementById('note-title-input').value.trim();
    const content = document.getElementById('note-content-input').innerHTML.trim();
    const category = document.getElementById('note-category').value;
    const bgColor = document.getElementById('note-bg-color').value;

    if (!title && !content) {
        showToast(t('empty_alert'));
        return;
    }

    const currentDate = new Date().toLocaleDateString();

    if (id) {
        const note = notes.find(n => n.id == id);
        if (note) {
            note.title = title || 'Untitled';
            note.content = content;
            note.category = category;
            note.bgColor = bgColor;
            note.date = currentDate;
        }
    } else {
        const newNote = {
            id: Date.now(),
            title: title || 'Untitled',
            content: content,
            category: category,
            bgColor: bgColor,
            pinned: false,
            date: currentDate
        };
        notes.unshift(newNote);
    }

    saveToStorage();
    renderNotes();
    closeNoteModal();
    showToast(t('saved_text'));
}

function togglePin(id) {
    const note = notes.find(n => n.id === id);
    if (note) {
        note.pinned = !note.pinned;
        saveToStorage();
        renderNotes();
    }
}

function deleteNote(id) {
    showConfirm(t('delete_confirm'), () => {
        notes = notes.filter(n => n.id !== id);
        saveToStorage();
        renderNotes();
    });
}

function updateCounters() {
    const text = document.getElementById('note-content-input').innerText;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    const chars = text.length;
    document.getElementById('counter-display').textContent = `Words: ${words} | Characters: ${chars}`;
}

function filterNotes() {
    renderNotes();
}

function shareNote(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;
    const plainText = note.content.replace(/<[^>]*>?/gm, '');
    const text = `*${note.title}*\n\n${plainText}`;
    if (navigator.share) {
        navigator.share({ title: note.title, text: text }).catch(() => {});
    } else {
        navigator.clipboard.writeText(text);
        showToast(t('share_copied'));
    }
}

function syncFirebase() {
    showToast("Syncing with Firebase...");
    setTimeout(() => {
        showToast("Firebase Sync Complete!");
    }, 1200);
}

function backupToFirebase() {
    saveNote();
    showToast("Backed up note to Firebase Cloud!");
}
</script>
</body>
</html>
