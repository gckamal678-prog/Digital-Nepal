<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transactions - Digital Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        const savedFontSize = localStorage.getItem('font_size') || 'normal';
        if (savedFontSize === 'small') {
            document.documentElement.style.fontSize = '14px';
        } else if (savedFontSize === 'large') {
            document.documentElement.style.fontSize = '18px';
        } else {
            document.documentElement.style.fontSize = '16px';
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 4px; }
    </style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 p-2 md:p-6 pb-28 transition-colors duration-300 w-full m-0 min-h-screen flex flex-col justify-between">

<div class="space-y-4 w-full flex-1">

                <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1" data-i18n="label_date">Date</label>
                <input type="date" id="date" required class="w-full border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-2.5 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <div>
                <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1" data-i18n="label_name">Name</label>
                <input type="text" id="name" placeholder="Enter name" required class="w-full border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 p-2.5 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <div>
                <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1" data-i18n="label_type">Type</label>
                <select id="type" class="w-full border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-2.5 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="Receivable" data-i18n="type_receivable">Receivable (To Take)</option>
                    <option value="Payable" data-i18n="type_payable">Payable (To Give)</option>
                    <option value="Expense" data-i18n="type_expense">Expense</option>
                </select>
            </div>

            <div>
                <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1" data-i18n="label_principal">Principal Amount (NPR / INR)</label>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" step="any" id="amount" placeholder="NPR (Rs)" required oninput="convertCurrency('npr')" class="border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-2.5 rounded-xl text-xs outline-none">
                    <input type="number" step="any" id="amount-inr" placeholder="INR (₹)" oninput="convertCurrency('inr')" class="border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-2.5 rounded-xl text-xs outline-none">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1" data-i18n="label_interest">Monthly Interest Rate (%)</label>
                <input type="number" step="any" id="interest-rate" placeholder="Monthly Rate (%)" oninput="calculateTotal()" class="w-full border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-2.5 rounded-xl text-xs outline-none">
            </div>
            
            <div>
                <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1" data-i18n="label_period">Period</label>
                <div class="grid grid-cols-12 gap-2">

                    <select id="time-unit" onchange="calculateTotal()" class="col-span-5 border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-2.5 rounded-xl text-[11px] outline-none">
                        <option value="Months" data-i18n="unit_months">Months</option>
                        <option value="Years" data-i18n="unit_years">Years</option>
                    </select>
                </div>
            </div>
            
            <div>
                <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1" data-i18n="label_total_amount">Total Amount</label>
                <input type="text" id="display-total-amount" readonly placeholder="Total calculation" class="w-full bg-slate-100 dark:bg-slate-800/80 text-slate-900 dark:text-white font-bold border border-slate-300 dark:border-slate-700 p-2.5 rounded-xl text-xs outline-none">
            </div>
            
            <input type="hidden" id="total-amount">
            
            <div class="md:col-span-3 flex justify-end gap-2 pt-1">
                <button type="button" onclick="resetForm()" id="btn-cancel-edit" class="hidden bg-slate-500 hover:bg-slate-600 text-white font-medium px-4 py-2 rounded-xl text-xs transition" data-i18n="btn_cancel">Cancel</button>

    <!-- Transaction List Container -->

                        <th class="py-2 px-3" data-i18n="th_date">Date</th>

                        <th class="py-2 px-3 text-right" data-i18n="th_total">Total</th>

</div>

    function applySettings() {

                el.classList.add(cardShape);

let allTransactions = [];
let modalCallback = null;
let currentSelectedName = null;

document.addEventListener("DOMContentLoaded", () => {
    applySettings();
    loadTransactionsFromStorage();
    document.getElementById('date').valueAsDate = new Date();
    renderView();
});

// Toast notification (Custom Message Box)
function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    
    let bgClass = "bg-slate-800 text-white";
    let iconClass = "fa-circle-info text-indigo-400";

    if (type === 'success') {
        bgClass = "bg-emerald-900/90 text-emerald-100 border border-emerald-700";
        iconClass = "fa-circle-check text-emerald-400";
    } else if (type === 'error') {
        bgClass = "bg-rose-900/90 text-rose-100 border border-rose-700";
        iconClass = "fa-circle-xmark text-rose-400";
    } else if (type === 'warning') {
        bgClass = "bg-amber-900/90 text-amber-100 border border-amber-700";
        iconClass = "fa-triangle-exclamation text-amber-400";
    }

    toast.className = `${bgClass} px-4 py-2.5 rounded-xl text-xs shadow-xl flex items-center gap-2 transition-all duration-300 transform translate-y-[-10px] opacity-0 pointer-events-auto`;
    toast.innerHTML = `<i class="fa-solid ${iconClass}"></i> <span>${message}</span>`;

    container.appendChild(toast);

    setTimeout(() => {
        toast.classList.remove('translate-y-[-10px]', 'opacity-0');
    }, 10);

    setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-10px]');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function loadTransactionsFromStorage() {
    const saved = localStorage.getItem('allTransactions');
    if (saved) {
        try { allTransactions = JSON.parse(saved); } catch (e) { allTransactions = []; }
    }
    updateOverviewStats();
}

function saveTransactionsToStorage() {
    localStorage.setItem('allTransactions', JSON.stringify(allTransactions));
    updateOverviewStats();
}

// Overview / Dashboard को लागि Total Summary Calculate गर्ने र सेभ गर्ने
function updateOverviewStats() {
    let totalReceivable = 0;
    let totalPayable = 0;
    let totalExpense = 0;

    allTransactions.forEach(tx => {
        let amt = parseFloat(tx.total || tx.amount || 0);
        if (tx.type === 'Receivable') {
            totalReceivable += amt;
        } else if (tx.type === 'Payable') {
            totalPayable += amt;
        } else if (tx.type === 'Expense') {
            totalExpense += amt;
        }
    });

    const overviewStats = {
        totalReceivable: totalReceivable.toFixed(2),
        totalPayable: totalPayable.toFixed(2),
        totalExpense: totalExpense.toFixed(2),
        netBalance: (totalReceivable - totalPayable - totalExpense).toFixed(2),
        lastUpdated: new Date().toISOString()
    };

    localStorage.setItem('overview_stats', JSON.stringify(overviewStats));
}

function convertCurrency(source) {
    const nprInput = document.getElementById('amount');
    const inrInput = document.getElementById('amount-inr');
    const conversionRate = 1.6;

    if (source === 'npr') {
        if (nprInput.value !== '') {
            inrInput.value = (parseFloat(nprInput.value) / conversionRate).toFixed(2);
        } else {
            inrInput.value = '';
        }
    } else if (source === 'inr') {
        if (inrInput.value !== '') {
            nprInput.value = (parseFloat(inrInput.value) * conversionRate).toFixed(2);
        } else {
            nprInput.value = '';
        }
    }
    calculateTotal();
}

// मासिक ब्याज हिसाब नियम
function calculateTotal() {
    let amount = parseFloat(document.getElementById('amount').value) || 0;
    let rate = parseFloat(document.getElementById('interest-rate').value) || 0;
    let time = parseFloat(document.getElementById('time-period').value) || 0;
    let unit = document.getElementById('time-unit').value;

    let totalMonths = (unit === 'Years' || unit === 'वर्ष') ? (time * 12) : time;

    let interest = (amount * rate * totalMonths) / 100;
    let total = amount + interest;

    const currSymbol = (localStorage.getItem('currency') === 'INR') ? '₹ ' : 'Rs ';
    document.getElementById('display-total-amount').value = currSymbol + total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    document.getElementById('total-amount').value = total.toFixed(2);
}

function saveTransaction(event) {
    event.preventDefault();
    const editIndex = document.getElementById('edit-index').value;
    const date = document.getElementById('date').value;
    const name = document.getElementById('name').value.trim();
    const type = document.getElementById('type').value;
    const amount = document.getElementById('amount').value;
    const interestRate = document.getElementById('interest-rate').value || '0';
    const timePeriod = (document.getElementById('time-period').value || '0') + ' ' + document.getElementById('time-unit').value;
    const total = document.getElementById('total-amount').value || amount;

    const transactionData = { date, name, type, amount, interestRate, timePeriod, total };

    if (editIndex === "") {
        allTransactions.push(transactionData);
        showToast("ट्रान्जेक्सन थपियो!", "success");
    } else {
        allTransactions[editIndex] = transactionData;
        showToast("ट्रान्जेक्सन अपडेट भयो!", "success");
    }

    allTransactions.sort((a, b) => a.name.localeCompare(b.name));
    saveTransactionsToStorage();
    renderView();
    resetForm();
}

function renderView() {
    if (currentSelectedName) {
        renderLedgerTable(currentSelectedName);
    } else {
        renderContactsTable();
    }
}

function filterData() {
    if (currentSelectedName) {
        renderLedgerTable(currentSelectedName);
    } else {
        renderContactsTable();
    }
}

function renderContactsTable() {
    const tbody = document.getElementById('contacts-table-body');
    const searchQuery = document.getElementById('search-transaction').value.toLowerCase();
    tbody.innerHTML = '';

    document.getElementById('contacts-table').classList.remove('hidden');
    document.getElementById('ledger-table').classList.add('hidden');
    document.getElementById('back-to-contacts-btn').classList.add('hidden');
    document.getElementById('table-main-title').innerText = t('parties_title');

    const partiesMap = {};
    allTransactions.forEach((tx) => {
        if (!partiesMap[tx.name]) {
            partiesMap[tx.name] = { name: tx.name, count: 0, netTotal: 0 };
        }
        partiesMap[tx.name].count += 1;
        partiesMap[tx.name].netTotal += parseFloat(tx.total || tx.amount || 0);
    });

    let parties = Object.values(partiesMap);
    parties.sort((a, b) => a.name.localeCompare(b.name));

    const filteredParties = parties.filter(p => p.name.toLowerCase().includes(searchQuery));

    if (filteredParties.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-400 text-xs">${t('no_records')}</td></tr>`;
        return;
    }

    const currSymbol = (localStorage.getItem('currency') === 'INR') ? '₹ ' : 'Rs ';

    filteredParties.forEach((party) => {
        tbody.innerHTML += `
            <tr onclick="openLedger('${party.name}')" class="border-b border-slate-200 dark:border-slate-800/60 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition cursor-pointer">
                <td class="py-2 px-3 font-bold text-slate-900 dark:text-white flex items-center gap-1.5">
                    <div class="w-5 h-5 rounded-full bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-[10px] font-bold">
                        ${party.name.charAt(0).toUpperCase()}
                    </div>
                    ${party.name}
                </td>
                <td class="py-2 px-3 text-right text-slate-600 dark:text-slate-300 font-medium">${party.count} <span data-i18n="th_total_entries">Entries</span></td>
                <td class="py-2 px-3 text-right font-extrabold text-indigo-600 dark:text-indigo-400">${currSymbol}${parseFloat(party.netTotal).toLocaleString()}</td>
                <td class="py-2 px-3 text-right">
                    <span class="text-indigo-600 dark:text-indigo-400 hover:underline text-[11px] font-semibold">${t('view_text')} <i class="fa-solid fa-chevron-right text-[9px]"></i></span>
                </td>
            </tr>
        `;
    });
}

function openLedger(name) {
    currentSelectedName = name;
    document.getElementById('search-transaction').value = '';
    renderLedgerTable(name);
}

function showContactsView() {
    currentSelectedName = null;
    document.getElementById('search-transaction').value = '';
    renderContactsTable();
}

function renderLedgerTable(name) {
    const tbody = document.getElementById('ledger-table-body');
    const searchQuery = document.getElementById('search-transaction').value.toLowerCase();
    tbody.innerHTML = '';

    document.getElementById('contacts-table').classList.add('hidden');
    document.getElementById('ledger-table').classList.remove('hidden');
    document.getElementById('back-to-contacts-btn').classList.remove('hidden');
    document.getElementById('table-main-title').innerText = `Ledger: ${name}`;

    const personTransactions = allTransactions.map((tx, idx) => ({ ...tx, globalIndex: idx }))
        .filter(tx => tx.name.toLowerCase() === name.toLowerCase());

    const filtered = personTransactions.filter(tx => tx.type.toLowerCase().includes(searchQuery) || tx.date.includes(searchQuery));

    if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-slate-400 text-xs">${t('no_records')}</td></tr>`;
        return;
    }

    const currSymbol = (localStorage.getItem('currency') === 'INR') ? '₹ ' : 'Rs ';

    filtered.forEach((tx) => {
        let badgeClass = "bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/20";
        if (tx.type === "Receivable") {
            badgeClass = "bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20";
        } else if (tx.type === "Payable") {
            badgeClass = "bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20";
        } else if (tx.type === "Expense") {
            badgeClass = "bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20";
        }

        tbody.innerHTML += `
            <tr class="border-b border-slate-200 dark:border-slate-800/60 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
                <td class="py-2 px-3 text-slate-500 dark:text-slate-400 text-[11px]">${tx.date}</td>
                <td class="py-2 px-3">
                    <span class="px-1.5 py-0.5 rounded-full text-[10px] font-semibold ${badgeClass}">${tx.type}</span>
                </td>
                <td class="py-2 px-3 text-right font-medium text-slate-900 dark:text-white">${currSymbol}${parseFloat(tx.amount).toLocaleString()}</td>
                <td class="py-2 px-3 text-slate-600 dark:text-slate-300 text-[11px]">${tx.timePeriod}</td>
                <td class="py-2 px-3 text-right font-bold text-indigo-600 dark:text-indigo-400">${currSymbol}${parseFloat(tx.total).toLocaleString()}</td>
                <td class="py-2 px-3 text-right whitespace-nowrap">
                    <div class="inline-flex items-center gap-1">
                        <button type="button" onclick="editTransaction(${tx.globalIndex})" class="bg-amber-500 hover:bg-amber-600 text-white px-1.5 py-0.5 rounded text-[10px] font-medium transition">${t('edit_text')}</button>
                        <button type="button" onclick="confirmDelete(${tx.globalIndex})" class="bg-red-500 hover:bg-red-600 text-white px-1.5 py-0.5 rounded text-[10px] font-medium transition">${t('del_text')}</button>
                    </div>
                </td>
            </tr>
        `;
    });
}

function editTransaction(idx) {
    const tx = allTransactions[idx];
    currentSelectedName = null;
    document.getElementById('edit-index').value = idx;
    document.getElementById('date').value = tx.date;
    document.getElementById('name').value = tx.name;
    document.getElementById('type').value = tx.type;
    document.getElementById('amount').value = tx.amount;
    document.getElementById('interest-rate').value = tx.interestRate || '';
    convertCurrency('npr');
    
    const timeParts = (tx.timePeriod || '').split(' ');
    document.getElementById('time-period').value = timeParts[0] || '';
    if(timeParts[1]) document.getElementById('time-unit').value = timeParts[1];

    calculateTotal();
    document.getElementById('btn-save').innerText = t('btn_update');
    document.getElementById('btn-cancel-edit').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function confirmDelete(idx) {
    showCustomModal(
        t('delete_title'),
        t('delete_msg'),
        t('delete_btn'),
        "bg-red-600 hover:bg-red-700 text-white shadow-lg shadow-red-600/25",
        () => {
            allTransactions.splice(idx, 1);
            allTransactions.sort((a, b) => a.name.localeCompare(b.name));
            saveTransactionsToStorage();
            renderView();
            showToast("रेकर्ड मेटाइयो!", "warning");
        }
    );
}

function showCustomModal(title, message, confirmText, confirmClass, callback) {
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-message').innerText = message;
    const confirmBtn = document.getElementById('modal-btn-confirm');
    confirmBtn.innerText = confirmText;
    confirmBtn.className = `font-medium px-3 py-1.5 rounded-xl text-xs transition ${confirmClass}`;
    modalCallback = callback;

    const modal = document.getElementById('custom-modal');
    const box = document.getElementById('modal-content-box');
    modal.classList.remove('hidden');
    setTimeout(() => {
        modal.classList.remove('opacity-0');
        box.classList.remove('scale-95');
        box.classList.add('scale-100');
    }, 10);
}

function closeCustomModal(isConfirmed) {
    const modal = document.getElementById('custom-modal');
    const box = document.getElementById('modal-content-box');
    modal.classList.add('opacity-0');
    box.classList.remove('scale-100');
    box.classList.add('scale-95');
    
    setTimeout(() => {
        modal.classList.add('hidden');
        if (isConfirmed && modalCallback) {
            modalCallback();
        }
        modalCallback = null;
    }, 300);
}

function resetForm() {
    document.getElementById('transaction-form').reset();
    document.getElementById('edit-index').value = "";
    document.getElementById('display-total-amount').value = '';
    document.getElementById('date').valueAsDate = new Date();
    document.getElementById('btn-save').innerText = t('btn_save');
    document.getElementById('btn-cancel-edit').classList.add('hidden');
}

// Data CSV/Excel मा डाउनलोड गर्ने
function exportToCSV() {
    if (allTransactions.length === 0) {
        showToast("Export गर्न कुनै ट्रान्जेक्सन छैन!", "warning");
        return;
    }
    let csv = 'Date,Name,Type,Principal,Interest Rate(%),Period,Total\n';
    allTransactions.forEach(tx => {
        csv += `"${tx.date}","${tx.name}","${tx.type}","${tx.amount}","${tx.interestRate || 0}","${tx.timePeriod}","${tx.total}"\n`;
    });
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.setAttribute('href', url);
    a.setAttribute('download', `Transactions_Backup_${new Date().toISOString().slice(0,10)}.csv`);
    a.click();
    showToast("CSV फाईल डाउनलोड भयो!", "success");
}

// ---------------- Firebase Sync functions ----------------
function syncWithFirebase() {
    showToast("Firebase Cloud सँग Sync हुँदैछ...", "info");
    // Firebase Firestore / Realtime Database Push Logic
    setTimeout(() => {
        showToast("सफलतापूर्वक Firebase मा सेभ भयो!", "success");
    }, 1000);
}

function restoreFromFirebase() {
    showToast("Firebase बाट डाटा तानिँदैछ...", "info");
    // Firebase Fetch Logic
    setTimeout(() => {
        showToast("Firebase बाट डाटा Restore भयो!", "success");
    }, 1000);
}
</script>
