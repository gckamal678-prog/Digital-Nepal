<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coming Soon - Digital Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Global Settings Script Integration -->
    <script src="../global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;500;600;700&family=Mukta:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 4px; }

        /* Custom Pulse & Glowing Animations */
        @keyframes floatEffect {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: floatEffect 3s ease-in-out infinite;
        }

        @keyframes shimmerText {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-animation {
            background: linear-gradient(90deg, #6366f1 0%, #ec4899 50%, #6366f1 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmerText 4s linear infinite;
        }

        /* Mobile touch fix */
        a, button {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 p-4 md:p-6 min-h-screen flex flex-col items-center justify-center transition-colors duration-300 w-full m-0 relative">

<!-- Custom Toast Notification Container -->
<div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

<!-- Main Container Card -->
<div class="bg-white dark:bg-slate-900 p-8 md:p-12 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 transition-colors duration-300 w-full max-w-lg text-center space-y-6">
    
    <!-- Animated Icon -->
    <div class="flex justify-center">
        <div class="w-20 h-20 rounded-2xl bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-200 dark:border-indigo-800/50 flex items-center justify-center text-indigo-600 dark:text-indigo-400 text-3xl shadow-lg shadow-indigo-500/10 animate-float">
            <i class="fa-solid fa-gift"></i>
        </div>
    </div>

    <!-- Title and Animated Message Section -->
    <div class="space-y-3">
        <h1 class="text-xl md:text-2xl font-bold tracking-tight text-slate-900 dark:text-white" data-i18n="page_title">
            छिट्टै आउँदैछ! (Coming Soon)
        </h1>
        <p class="text-sm md:text-base font-semibold shimmer-animation py-2 leading-relaxed" data-i18n="animated_message">
            हामी नयाँ कोसेली लिएर छिट्टै आउँदैछौं...
        </p>
        <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto" data-i18n="page_desc">
            हामी तपाईंको अनुभवलाई थप उत्कृष्ट बनाउन रोमाञ्चक सुविधाहरूमा काम गरिरहेका छौं। कृपया पर्खनुहोला!
        </p>
    </div>

    <!-- Action Button / Navigation -->
    <div class="pt-4">
        <a href="settings.html" class="inline-flex items-center justify-center gap-2 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-3 rounded-xl text-xs transition shadow-md shadow-indigo-600/20">
            <i class="fa-solid fa-arrow-left"></i> <span data-i18n="btn_back">सेटिङ्मा फर्կनुहोस् (Back to Settings)</span>
        </a>
    </div>

    <!-- Footer Copyright -->
    <div class="pt-4 border-t border-slate-100 dark:border-slate-800 text-center text-[11px] text-slate-400">
        <p>©️ 2026 Digital Notebook. All Rights Reserved.</p>
    </div>

</div>

<script>
    function showToast(msg, type = "info") {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `p-3 rounded-xl text-xs font-semibold text-white shadow-xl transition-all duration-300 transform translate-y-2 opacity-0 flex items-center gap-2 pointer-events-auto ${
            type === "error" ? "bg-red-600" : "bg-emerald-600"
        }`;
        toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-xmark' : 'fa-circle-check'}"></i> <span>${msg}</span>`;
        container.appendChild(toast);

        setTimeout(() => {
            toast.classList.remove('translate-y-2', 'opacity-0');
        }, 10);

        setTimeout(() => {
            toast.classList.add('opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 1000);
    }

    const translations = {
        en: {
            page_title: "Coming Soon!",
            animated_message: "We are coming soon with a new surprise gift...",
            page_desc: "We are working on exciting features to enhance your experience. Stay tuned!",
            btn_back: "Back to Settings"
        },
        np: {
            page_title: "छिट्टै आउँदैछ! (Coming Soon)",
            animated_message: "हामी नयाँ कोसेली लिएर छिट्टै आउँदैछौं...",
            page_desc: "हामी तपाईंको अनुभवलाई थप उत्कृष्ट बनाउन रोमाञ्चक सुविधाहरूमा काम गरिरहेका छौं। कृपया पर्खनुहोला!",
            btn_back: "सेटिङ्मा फर्किनुहोस् (Back to Settings)"
        }
    };

    document.addEventListener("DOMContentLoaded", () => {
        applyLanguageSettings();
    });

    function applyLanguageSettings() {
        const lang = localStorage.getItem('language') || 'en';
        document.documentElement.setAttribute('lang', lang);

        // Apply theme saved in local storage if available
        const theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        // Apply font settings if available
        const fontSize = localStorage.getItem('font_size') || '15';
        document.body.style.fontSize = fontSize + 'px';

        const fontFamily = localStorage.getItem('font_family') || 'Poppins';
        document.body.style.fontFamily = `'${fontFamily}', sans-serif`;

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) {
                el.innerText = translations[lang][key];
            }
        });
    }
</script>

</body>
</html>
